<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caselog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg: #F5F3EC;
    --surface: #FFFFFF;
    --surface-2: #EAE6D9;
    --border: #DBD5C3;
    --ink: #211D16;
    --ink-muted: #6E6455;
    --ink-faint: #9A917E;
    --accent: #24406B;
    --accent-ink: #FFFFFF;
    --accent-soft: #DEE6EF;
    --good: #0ca30c;
    --good-text: #006300;
    --warn: #b9791c;
    --low: #b23b34;
    --series-ps: #2a78d6;
    --series-an: #eb6834;
    --series-comm: #1baf7a;
    --series-biz: #eda100;
    --chart-grid: #e3ddcb;
    --chart-axis: #c7c0ac;
    --shadow: 0 1px 2px rgba(33,29,22,0.06), 0 8px 24px -12px rgba(33,29,22,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #14171C;
      --surface: #1B1F26;
      --surface-2: #20252D;
      --border: #313844;
      --ink: #ECEAE2;
      --ink-muted: #A6ACB6;
      --ink-faint: #767E89;
      --accent: #7DA1D6;
      --accent-ink: #0E1A2B;
      --accent-soft: #22344B;
      --good: #3FAE6E;
      --good-text: #6FCB94;
      --warn: #E0A542;
      --low: #E0685F;
      --series-ps: #3987e5;
      --series-an: #d95926;
      --series-comm: #199e70;
      --series-biz: #c98500;
      --chart-grid: #2a3038;
      --chart-axis: #3a4048;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #14171C;
    --surface: #1B1F26;
    --surface-2: #20252D;
    --border: #313844;
    --ink: #ECEAE2;
    --ink-muted: #A6ACB6;
    --ink-faint: #767E89;
    --accent: #7DA1D6;
    --accent-ink: #0E1A2B;
    --accent-soft: #22344B;
    --good: #3FAE6E;
    --good-text: #6FCB94;
    --warn: #E0A542;
    --low: #E0685F;
    --series-ps: #3987e5;
    --series-an: #d95926;
    --series-comm: #199e70;
    --series-biz: #c98500;
    --chart-grid: #2a3038;
    --chart-axis: #3a4048;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family:"Fraunces", Georgia, serif; font-weight:600; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .num{ font-variant-numeric: tabular-nums; }
  a{ color: inherit; }
  button{ font: inherit; color: inherit; }
  code{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.9em; }

  .topbar{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px;
    padding: 14px 24px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .wordmark{ display:flex; align-items:baseline; gap:8px; }
  .wordmark .mark{ font-family:"Fraunces"; font-weight:700; font-size:1.35rem; letter-spacing:-0.01em; }
  .wordmark .tag{ font-size:0.72rem; color: var(--ink-faint); letter-spacing:0.03em; }
  .topbar-right{ display:flex; align-items:center; gap:14px; font-size:0.88rem; }
  .who{ display:flex; align-items:center; gap:8px; color: var(--ink-muted); }
  .who b{ color: var(--ink); font-weight:600; }
  .linklike{ background:none; border:none; padding:0; cursor:pointer; color: var(--accent); font-weight:600; font-size:0.85rem; text-decoration: underline; text-underline-offset:2px; }
  .linklike:hover{ opacity:0.8; }

  main{ max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    border-radius: 8px; border: 1px solid var(--border);
    padding: 10px 16px; font-weight:600; font-size:0.9rem;
    background: var(--surface); cursor:pointer;
  }
  .btn:hover{ border-color: var(--ink-faint); }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover{ opacity:0.92; }
  .btn-small{ padding:6px 12px; font-size:0.82rem; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  input[type=text], input[type=date], select, textarea{
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px;
    width:100%;
  }
  textarea{ resize: vertical; min-height: 72px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  label{ font-size:0.82rem; font-weight:600; color: var(--ink-muted); display:block; margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .field-row > .field{ flex:1; min-width:160px; }

  /* --- picker / simple pages --- */
  .picker-wrap{ max-width: 560px; margin: 10vh auto 0; padding: 0 24px; text-align:center; }
  .picker-wrap h1{ font-size: 2rem; margin-bottom:6px; }
  .picker-wrap p{ color: var(--ink-muted); margin: 0 0 28px; }
  .mentor-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .mentor-chip{
    padding: 14px 10px; border-radius: 10px; border:1px solid var(--border);
    background: var(--surface); cursor:pointer; font-weight:600; font-size:0.95rem;
    box-shadow: var(--shadow);
  }
  .mentor-chip:hover{ border-color: var(--accent); color: var(--accent); }
  .back-link{ margin-bottom:18px; }

  .section-sub{ font-size:0.82rem; color: var(--ink-faint); margin: -6px 0 14px; }

  /* --- roster / pod grid (leader view) --- */
  .roster-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom: 22px; flex-wrap:wrap; }
  .roster-head h1{ font-size:1.7rem; }
  .roster-head .count{ color: var(--ink-muted); font-size:0.95rem; }
  .mentee-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .mentee-card{
    background: var(--surface); border:1px solid var(--border); border-radius:12px;
    padding: 16px 16px 14px; box-shadow: var(--shadow); cursor:pointer;
    display:flex; flex-direction:column; gap:10px;
  }
  .mentee-card:hover{ border-color: var(--accent); }
  .mentee-card .name{ font-family:"Fraunces"; font-weight:600; font-size:1.12rem; }
  .mentee-card .meta{ color: var(--ink-faint); font-size:0.78rem; }
  .mentee-card .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .empty-note{ color: var(--ink-faint); font-size:0.82rem; font-style:italic; }

  .card{ background: var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow: var(--shadow); }

  .section-title{ font-size:1.1rem; margin: 30px 0 12px; display:flex; align-items:baseline; justify-content:space-between; }
  .history-empty{ padding: 30px; text-align:center; color: var(--ink-muted); border:1px dashed var(--border); border-radius:12px; }

  .case-row{ border:1px solid var(--border); border-radius:12px; background: var(--surface); margin-bottom:10px; overflow:hidden; }
  .case-row-head{ display:flex; align-items:center; gap:14px; padding:13px 16px; cursor:pointer; flex-wrap:wrap; }
  .case-row-head:hover{ background: var(--surface-2); }
  .case-row .date{ font-family:"IBM Plex Mono"; font-size:0.82rem; color: var(--ink-muted); min-width:82px; }
  .case-row .cname{ font-weight:600; flex:1; min-width:120px; }
  .case-row .chevron{ transition: transform 0.15s; color: var(--ink-faint); margin-left:auto; }
  .case-row.open .chevron{ transform: rotate(90deg); }
  .case-row-body{ display:none; padding: 6px 18px 18px; border-top:1px solid var(--border); }
  .case-row.open .case-row-body{ display:block; }

  /* --- overlay/modal --- */
  .overlay{ position:fixed; inset:0; background: rgba(20,17,10,0.45); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding: 5vh 20px; overflow-y:auto; }
  :root:not([data-theme="light"]) .overlay{ background: rgba(0,0,0,0.6); }
  :root[data-theme="dark"] .overlay{ background: rgba(0,0,0,0.6); }
  .modal{ background: var(--surface); border-radius:16px; width:100%; max-width:640px; box-shadow: var(--shadow); border:1px solid var(--border); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 18px 22px; }
  .modal-head h2{ font-size:1.25rem; }
  .modal-body{ padding: 8px 22px 24px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding: 14px 22px; border-top:1px solid var(--border); }
  .close-x{ background:none; border:none; cursor:pointer; color: var(--ink-faint); font-size:1.3rem; line-height:1; padding:4px; }
  .close-x:hover{ color: var(--ink); }

  .hint{ font-size:0.78rem; color: var(--ink-faint); margin-top:-6px; margin-bottom:14px; }
  .block-msg{ font-size:0.78rem; color: var(--low); margin-right:auto; align-self:center; }

  .conn-banner{ max-width:560px; margin: 14vh auto 0; padding:24px; text-align:center; color: var(--ink-muted); }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg); padding:11px 18px; border-radius:10px;
    font-size:0.85rem; box-shadow: var(--shadow); opacity:0; transition: opacity 0.18s, transform 0.18s;
    z-index:100; pointer-events:none; max-width: min(90vw, 420px); text-align:center;
  }
  :root:not([data-theme="light"]) .toast{ background: var(--surface-2); color: var(--ink); border:1px solid var(--border); }
  :root[data-theme="dark"] .toast{ background: var(--surface-2); color: var(--ink); border:1px solid var(--border); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* --- trend logging (specific to this tool) --- */
  .cat-log-block{ border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .cat-log-name{ font-size:0.85rem; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:7px; }
  .cat-log-name .sw{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .first-of-kind-note{ font-size:0.82rem; color: var(--ink-faint); font-style:italic; margin:0; }
  .trend-toggle{ display:flex; gap:8px; flex-wrap:wrap; }
  .trend-btn{
    flex:1; min-width:84px; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background: var(--surface); cursor:pointer; font-weight:600; font-size:0.85rem; text-align:center;
  }
  .trend-btn:hover{ border-color: var(--ink-faint); }
  .trend-btn.selected{ border-color: var(--ink-muted); background: var(--surface-2); }
  .trend-btn.selected[data-trend="better"]{ border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-text); }
  .trend-btn.selected[data-trend="worse"]{ border-color: var(--low); background: color-mix(in srgb, var(--low) 14%, transparent); color: var(--low); }
  .trend-note-row{ margin-top:10px; }
  .trend-chip{ display:inline-flex; align-items:center; gap:5px; font-size:0.78rem; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .trend-chip.better{ background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-text); }
  .trend-chip.worse{ background: color-mix(in srgb, var(--low) 14%, transparent); color: var(--low); }
  .trend-chip.same{ background: var(--surface-2); color: var(--ink-muted); }
  .trend-chip.first{ background: var(--surface-2); color: var(--ink-faint); }
  .history-cat-note{ font-size:0.82rem; color: var(--ink-muted); margin-top:8px; line-height:1.5; }
  .history-cat-note b{ color: var(--ink); }

  @media (max-width: 560px){
    .topbar{ padding: 12px 16px; }
    main{ padding: 22px 16px 60px; }
  }
</style>

</head>
<body>

<div id="topbar" class="topbar">
  <div class="wordmark">
    <span class="mark">Caselog</span>
    <span class="tag">your own trajectory, in your own words</span>
  </div>
  <div class="topbar-right">
    <span id="whoBox" class="who" hidden><span id="whoLabel"></span> <b id="whoName"></b></span>
  </div>
</div>

<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script>
(function(){
  "use strict";

  // Same Firebase project as casebook.html (public by design, see README).
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB98nxRs2SkBqR1NeNvcwuPrWdUh4YK36Q",
    authDomain: "ca-casing-tracker.firebaseapp.com",
    projectId: "ca-casing-tracker",
    storageBucket: "ca-casing-tracker.firebasestorage.app",
    messagingSenderId: "499490855868",
    appId: "1:499490855868:web:824ab3b8f71625009e69b9"
  };

  /* ---------------- domain model ----------------
   * Same four category names as casebook.html, for continuity — but
   * this tool has no rubric, no anchors, no numeric score. A category
   * here is only ever "better / same / worse than your own last entry",
   * or null the first time you log it. Do not add a numeric score to
   * this file; that is what casebook.html is for.
   */
  var CATEGORIES = [
    { key:'ps', label:'Problem Solving & Framework', short:'Problem solving', color:'var(--series-ps)' },
    { key:'analytical', label:'Analytical Skills', short:'Analytical', color:'var(--series-an)' },
    { key:'comm', label:'Communication & Delivery', short:'Communication', color:'var(--series-comm)' },
    { key:'biz', label:'Business Judgment & Recommendation', short:'Business judgment', color:'var(--series-biz)' }
  ];

  function isValidNote(text){
    var trimmed = (text || '').trim();
    var nonWhitespace = trimmed.replace(/\s/g, '');
    if (nonWhitespace.length < 10) return false;
    if (!/[a-zA-Z0-9]/.test(trimmed)) return false;
    return true;
  }

  var toastTimeout = null;
  function showToast(msg){
    var el = document.getElementById('toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function(){ el.classList.remove('show'); }, 3200);
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso){
    var parts = iso.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year: 'numeric' });
  }
  function isoFromDate(d){
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }
  function todayISO(){ return isoFromDate(new Date()); }
  function serverNow(){ return firebase.firestore.FieldValue.serverTimestamp(); }

  /* ---------------- state ---------------- */

  var state = {
    db: null,
    mode: undefined,          // undefined=detecting | 'mentee' | 'leader' | 'invalid-link'
    mentors: [],
    mentees: [],
    menteeId: null,           // mentee mode
    confirmation: null,       // { caseName, date } shown after a successful log
    mentorId: null,           // leader mode
    isAdmin: false,
    overlay: null              // null | {type:'newEntry', menteeId, baseline} | {type:'history', menteeId, entries, loading}
  };

  var appEl = document.getElementById('app');
  var whoBox = document.getElementById('whoBox');
  var whoLabel = document.getElementById('whoLabel');
  var whoName = document.getElementById('whoName');

  function mentorById(id){ return state.mentors.filter(function(m){ return m.id===id; })[0]; }
  function menteeById(id){ return state.mentees.filter(function(m){ return m.id===id; })[0]; }
  function menteesForMentor(mentorId){ return state.mentees.filter(function(m){ return m.primaryMentorId===mentorId; }); }

  /* ---------------- init / routing / auth ---------------- */

  function init(){
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      state.db = firebase.firestore();
    } catch(e){
      console.error('firebase init failed', e);
      state.mode = 'invalid-link';
      render();
      return;
    }

    subscribePublicRoster();

    var params = new URLSearchParams(window.location.search);
    var m = params.get('m');
    var t = params.get('t');
    var a = params.get('a');

    if (m){
      bootstrapLeader(m, t, a === '1' || a === 'true');
    } else {
      state.mode = 'mentee';
      try {
        var savedMentee = localStorage.getItem('caselog.menteeId');
        if (savedMentee) state.menteeId = savedMentee;
      } catch(e){}
      render();
    }
  }

  function subscribePublicRoster(){
    state.db.collection('mentees').orderBy('name').onSnapshot(function(snap){
      state.mentees = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('mentees sub failed', err); });
    state.db.collection('mentors').orderBy('name').onSnapshot(function(snap){
      state.mentors = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('mentors sub failed', err); });
  }

  /**
   * Optional leadership view (see README): reuses the exact same
   * mentorTokens/mentorSessions bearer-link mechanism as casebook.html
   * — same anonymous-auth identity, same collections, no new schema.
   * A pod lead who already bootstrapped casebook.html in this browser
   * can open this tool with just `?m=<mentorId>` (their session already
   * exists); a first-time visit needs the full `?m=&t=` link.
   */
  function bootstrapLeader(mentorId, token, claimedAdmin){
    function createSession(uid){
      var payload = { token: token, mentorId: mentorId, isAdmin: !!claimedAdmin };
      return state.db.collection('mentorSessions').doc(uid).set(payload).then(function(){ return payload; });
    }

    firebase.auth().signInAnonymously().then(function(cred){
      var uid = cred.user.uid;
      return state.db.collection('mentorSessions').doc(uid).get().then(function(snap){
        if (!snap.exists){
          if (!token) return Promise.reject(new Error('no existing session and no token in the URL'));
          return createSession(uid);
        }
        if (token && snap.data().token !== token){
          return firebase.auth().signOut()
            .then(function(){ return firebase.auth().signInAnonymously(); })
            .then(function(freshCred){ return createSession(freshCred.user.uid); });
        }
        return snap.data();
      });
    }).then(function(sessionData){
      state.mode = 'leader';
      state.mentorId = sessionData.mentorId;
      state.isAdmin = !!sessionData.isAdmin;
      try {
        var url = new URL(window.location.href);
        if (url.searchParams.has('t')){
          url.searchParams.delete('t');
          history.replaceState({}, '', url.toString());
        }
      } catch(e){}
      render();
    }).catch(function(err){
      console.error('leader bootstrap failed', err);
      state.mode = 'invalid-link';
      render();
    });
  }

  /* ---------------- data access ---------------- */

  function fetchSelfLog(menteeId, lim){
    return state.db.collection('selfLog')
      .where('menteeId','==',menteeId)
      .orderBy('date','desc')
      .limit(lim)
      .get()
      .then(function(snap){ return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); })
      .catch(function(err){ console.error('selfLog fetch failed', err); return []; });
  }

  /* ---------------- render ---------------- */

  function updateTopbar(){
    if (state.mode === 'leader' && state.mentorId){
      var mentor = mentorById(state.mentorId);
      whoBox.hidden = false;
      whoLabel.textContent = 'Pod lead:';
      whoName.textContent = mentor ? mentor.name : state.mentorId;
    } else {
      whoBox.hidden = true;
    }
  }

  function render(){
    updateTopbar();

    if (state.mode === undefined){
      appEl.innerHTML = '<div class="conn-banner">Connecting&hellip;</div>';
    } else if (state.mode === 'invalid-link'){
      appEl.innerHTML = '<div class="conn-banner"><h1 style="font-size:1.4rem;margin-bottom:10px;">This link isn’t valid</h1><p>Contact the program chairs for a working link.</p></div>';
    } else if (state.mode === 'leader'){
      appEl.innerHTML = leaderHTML();
    } else {
      if (!state.menteeId) appEl.innerHTML = menteePickerHTML();
      else if (state.confirmation) appEl.innerHTML = confirmationHTML();
      else appEl.innerHTML = menteeHomeHTML(state.menteeId);
    }

    renderOverlay();

    if (state.mode === 'mentee' && !state.menteeId){
      wireNamePickerSearch(appEl);
    }
  }

  /* ---------------- mentee mode ---------------- */

  function menteePickerHTML(){
    var list = state.mentees.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    if (list.length === 0){
      return '<div class="picker-wrap"><h1>No mentees on the roster yet</h1><p>Check back once your program has been set up.</p></div>';
    }
    return '<div class="picker-wrap">'
      + '<h1>Find your name</h1>'
      + '<p>Pick yourself to log your own cases.</p>'
      + '<div class="field" style="text-align:left;max-width:320px;margin:0 auto 16px;"><input type="text" id="nameSearchInput" placeholder="Search by name&hellip;" autocomplete="off"></div>'
      + '<div class="mentor-grid" id="nameSearchGrid">'
      + list.map(function(m){
          var mentor = mentorById(m.primaryMentorId);
          var search = (m.name + ' ' + (mentor ? mentor.name : '')).toLowerCase();
          return '<button class="mentor-chip" data-action="select-mentee-self" data-id="'+esc(m.id)+'" data-search="'+esc(search)+'">'+esc(m.name)+'</button>';
        }).join('')
      + '</div>'
      + '<p class="empty-note" id="nameSearchEmpty" hidden>No matches &mdash; check the spelling, or search your pod lead’s name instead.</p>'
      + '</div>';
  }

  function wireNamePickerSearch(root){
    var input = root.querySelector('#nameSearchInput');
    var grid = root.querySelector('#nameSearchGrid');
    var empty = root.querySelector('#nameSearchEmpty');
    if (!input || !grid) return;
    input.addEventListener('input', function(){
      var q = input.value.trim().toLowerCase();
      var visible = 0;
      grid.querySelectorAll('.mentor-chip').forEach(function(chip){
        var match = !q || chip.getAttribute('data-search').indexOf(q) !== -1;
        chip.hidden = !match;
        if (match) visible++;
      });
      if (empty) empty.hidden = visible !== 0;
    });
    input.focus();
  }

  function menteeHomeHTML(menteeId){
    var mentee = menteeById(menteeId);
    if (!mentee){
      return '<div class="picker-wrap"><p class="empty-note">We couldn’t find that name on the roster.</p><button class="linklike" data-action="switch-mentee">Pick again</button></div>';
    }
    return '<div class="picker-wrap">'
      + '<h1>Hi '+esc(mentee.name)+'</h1>'
      + '<p>No score to measure up to here — just whether this one felt better, the same, or worse than your last.</p>'
      + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
      + '<button class="btn btn-primary" data-action="new-entry" data-id="'+esc(menteeId)+'">+ Log a session</button>'
      + '<button class="btn" data-action="view-history" data-id="'+esc(menteeId)+'">My history</button>'
      + '</div>'
      + '<p style="margin-top:22px;"><button class="linklike" data-action="switch-mentee">not you? pick again</button></p>'
      + '</div>';
  }

  function confirmationHTML(){
    var c = state.confirmation || {};
    return '<div class="picker-wrap">'
      + '<h1>Logged</h1>'
      + '<p>'+(c.caseName ? esc(c.caseName) : 'Your session')+' is saved.</p>'
      + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
      + '<button class="btn btn-primary" data-action="log-another">Log another session</button>'
      + '<button class="btn" data-action="view-history" data-id="'+esc(state.menteeId||'')+'">View my history</button>'
      + '</div>'
      + '</div>';
  }

  /* ---------------- leader mode (optional) ---------------- */

  function leaderHTML(){
    var mentor = mentorById(state.mentorId);
    var mentees = menteesForMentor(state.mentorId);
    var rows = mentees.length
      ? mentees.map(function(mt){
          return '<div class="mentee-card" data-action="view-history" data-id="'+esc(mt.id)+'">'
            + '<div class="row"><span class="name">'+esc(mt.name)+'</span><span class="meta">view trend &rarr;</span></div>'
            + '</div>';
        }).join('')
      : '<p class="empty-note">No mentees assigned yet.</p>';
    return '<div class="roster-head"><div><h1>'+esc(mentor ? mentor.name : '')+'’s pod</h1></div><span class="count">'+mentees.length+' mentee'+(mentees.length===1?'':'s')+'</span></div>'
      + '<p class="section-sub">Self-logged trend and notes, in each mentee’s own words &mdash; no score, nothing averaged across the pod.</p>'
      + '<div class="mentee-grid">'+rows+'</div>';
  }

  /* ---------------- log a session ---------------- */

  /**
   * Before opening the form, checks whether this mentee has logged
   * anything before at all — that decides "first time logging this
   * one" (every category, forced null, nothing to compare to yet) vs.
   * a normal better/same/worse pick for every category. Every entry
   * after the first always carries all four category keys, so "a prior
   * entry exists for this category" collapses to "a prior entry exists
   * at all" — it's never true for some categories and not others.
   * Computed once up front so a slow network can't change the form's
   * shape out from under someone mid-entry.
   */
  function openNewEntryOverlay(menteeId){
    if (!state.db) return;
    fetchSelfLog(menteeId, 1).then(function(entries){
      var isFirstEntry = entries.length === 0;
      var baseline = {};
      CATEGORIES.forEach(function(c){ baseline[c.key] = { isFirstOfKind: isFirstEntry }; });
      state.overlay = { type:'newEntry', menteeId: menteeId, baseline: baseline };
      render();
    });
  }

  function newEntryModalHTML(menteeId, baseline){
    var mentee = menteeById(menteeId);
    var today = todayISO();

    var groups = CATEGORIES.map(function(c){
      var fk = baseline[c.key].isFirstOfKind;
      if (fk){
        return '<div class="cat-log-block" data-cat="'+c.key+'">'
          + '<div class="cat-log-name"><span class="sw" style="background:'+c.color+'"></span>'+c.label+'</div>'
          + '<p class="first-of-kind-note">First time logging this one &mdash; nothing to compare yet. This entry sets your baseline.</p>'
          + '</div>';
      }
      return '<div class="cat-log-block" data-cat="'+c.key+'">'
        + '<div class="cat-log-name"><span class="sw" style="background:'+c.color+'"></span>'+c.label+'</div>'
        + '<div class="trend-toggle">'
        + '<button type="button" class="trend-btn" data-cat="'+c.key+'" data-trend="better">Better</button>'
        + '<button type="button" class="trend-btn" data-cat="'+c.key+'" data-trend="same">Same</button>'
        + '<button type="button" class="trend-btn" data-cat="'+c.key+'" data-trend="worse">Worse</button>'
        + '</div>'
        + '<div class="trend-note-row" id="note_'+c.key+'" hidden>'
        + '<label id="noteLabel_'+c.key+'" for="noteText_'+c.key+'">What changed?</label>'
        + '<textarea class="note-text" id="noteText_'+c.key+'" placeholder="At least 10 characters."></textarea>'
        + '</div>'
        + '</div>';
    }).join('');

    return '<div class="modal" role="dialog" aria-modal="true">'
      + '<div class="modal-head" style="border-bottom:1px solid var(--border);"><h2>Log a session'+(mentee ? ' &mdash; '+esc(mentee.name) : '')+'</h2><button class="close-x" data-action="close-overlay">&times;</button></div>'
      + '<form id="entryForm">'
      + '<div class="modal-body" style="padding-top:20px;">'
      + '<div class="field-row">'
      + '<div class="field"><label for="entryDate">Date</label><input type="date" id="entryDate" value="'+today+'"></div>'
      + '<div class="field"><label for="entryCaseName">Case</label><input type="text" id="entryCaseName" placeholder="e.g. Market entry &mdash; sparkling water"></div>'
      + '</div>'
      + '<p class="hint" style="margin-top:0;">Rate each category against your own last session &mdash; not against anyone else’s bar, and not against how far into the program you are.</p>'
      + groups
      + '</div>'
      + '<div class="modal-foot">'
      + '<span id="entryBlockMsg" class="block-msg" hidden></span>'
      + '<button type="button" class="btn" data-action="close-overlay">Cancel</button>'
      + '<button type="submit" id="entrySaveBtn" class="btn btn-primary">Save session</button>'
      + '</div>'
      + '</form>'
      + '</div>';
  }

  function updateEntrySaveState(root){
    var overlay = state.overlay;
    if (!overlay || overlay.type !== 'newEntry') return;
    var blocking = [];
    CATEGORIES.forEach(function(c){
      if (overlay.baseline[c.key].isFirstOfKind) return;
      var selectedBtn = root.querySelector('.trend-btn.selected[data-cat="'+c.key+'"]');
      if (!selectedBtn){ blocking.push(c.short); return; }
      var trend = selectedBtn.getAttribute('data-trend');
      if (trend === 'same') return;
      var noteEl = document.getElementById('noteText_'+c.key);
      if (!isValidNote(noteEl ? noteEl.value : '')) blocking.push(c.short);
    });
    var saveBtn = document.getElementById('entrySaveBtn');
    var blockMsg = document.getElementById('entryBlockMsg');
    if (!saveBtn || !blockMsg) return;
    if (blocking.length){
      saveBtn.disabled = true;
      blockMsg.hidden = false;
      blockMsg.textContent = 'Needs attention: ' + blocking.join(', ');
    } else {
      saveBtn.disabled = false;
      blockMsg.hidden = true;
      blockMsg.textContent = '';
    }
  }

  function wireEntryForm(root){
    root.querySelectorAll('.trend-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var cat = btn.getAttribute('data-cat');
        root.querySelectorAll('.trend-btn[data-cat="'+cat+'"]').forEach(function(b){ b.classList.remove('selected'); });
        btn.classList.add('selected');
        var trend = btn.getAttribute('data-trend');
        var noteRow = document.getElementById('note_'+cat);
        var noteLabel = document.getElementById('noteLabel_'+cat);
        if (noteRow){
          if (trend === 'same'){
            noteRow.hidden = true;
          } else {
            noteRow.hidden = false;
            if (noteLabel) noteLabel.textContent = trend === 'better' ? 'What improved?' : 'What got harder?';
          }
        }
        updateEntrySaveState(root);
      });
    });
    root.querySelectorAll('.note-text').forEach(function(ta){
      ta.addEventListener('input', function(){ updateEntrySaveState(root); });
    });
    updateEntrySaveState(root);
  }

  document.addEventListener('submit', function(e){
    if (e.target.id !== 'entryForm') return;
    e.preventDefault();
    if (!state.db) return;

    var overlay = state.overlay;
    var menteeId = overlay.menteeId;
    var baseline = overlay.baseline;
    var root = document.getElementById('overlayRoot');

    var date = document.getElementById('entryDate').value || todayISO();
    var caseName = document.getElementById('entryCaseName').value.trim();

    var categoriesObj = {}, blocked = false;
    CATEGORIES.forEach(function(c){
      if (baseline[c.key].isFirstOfKind){
        categoriesObj[c.key] = { trend: null };
        return;
      }
      var selectedBtn = root.querySelector('.trend-btn.selected[data-cat="'+c.key+'"]');
      if (!selectedBtn){ blocked = true; return; }
      var trend = selectedBtn.getAttribute('data-trend');
      if (trend === 'same'){
        categoriesObj[c.key] = { trend: 'same' };
      } else {
        var noteEl = document.getElementById('noteText_'+c.key);
        var text = (noteEl ? noteEl.value : '').trim();
        if (!isValidNote(text)){ blocked = true; return; }
        categoriesObj[c.key] = { trend: trend, note: text };
      }
    });
    if (blocked){ updateEntrySaveState(root); return; }

    state.db.collection('selfLog').add({
      menteeId: menteeId, caseName: caseName, date: date,
      categories: categoriesObj, createdAt: serverNow()
    }).then(function(){
      state.overlay = null;
      state.confirmation = { caseName: caseName, date: date };
      render();
    }).catch(function(err){
      console.error('save selfLog failed', err);
      showToast('Couldn’t save. Please try again.');
    });
  });

  /* ---------------- history (mentee's own, or a leader's pod) ---------------- */

  function openHistoryOverlay(menteeId){
    if (!state.db) return;
    state.overlay = { type:'history', menteeId: menteeId, entries: [], loading: true };
    render();
    fetchSelfLog(menteeId, 50).then(function(entries){
      if (!state.overlay || state.overlay.type !== 'history' || state.overlay.menteeId !== menteeId) return;
      state.overlay = { type:'history', menteeId: menteeId, entries: entries, loading: false };
      render();
    });
  }

  function trendChipHTML(catEntry, short){
    if (!catEntry || catEntry.trend == null) return '<span class="trend-chip first">'+esc(short)+' &middot; first log</span>';
    var arrow = catEntry.trend === 'better' ? '&uarr;' : catEntry.trend === 'worse' ? '&darr;' : '&rarr;';
    return '<span class="trend-chip '+catEntry.trend+'">'+arrow+' '+esc(short)+'</span>';
  }

  function historyEntryHTML(entry){
    var chips = CATEGORIES.map(function(c){
      return trendChipHTML(entry.categories ? entry.categories[c.key] : null, c.short);
    }).join('');
    var notes = CATEGORIES.map(function(c){
      var ce = entry.categories && entry.categories[c.key];
      if (!ce || !ce.note) return '';
      return '<div class="history-cat-note"><b>'+esc(c.short)+':</b> '+esc(ce.note)+'</div>';
    }).join('');
    return '<div class="case-row">'
      + '<div class="case-row-head" data-action="toggle-case">'
      + '<span class="date">'+fmtDate(entry.date)+'</span>'
      + '<span class="cname">'+(entry.caseName ? esc(entry.caseName) : '<span class="empty-note">untitled session</span>')+'</span>'
      + '<span class="chevron">▸</span>'
      + '</div>'
      + '<div class="case-row-body">'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">'+chips+'</div>'
      + notes
      + '</div>'
      + '</div>';
  }

  function historyModalHTML(menteeId, entries){
    var mentee = menteeById(menteeId);
    var title = 'History' + (mentee ? ' &mdash; '+esc(mentee.name) : '');
    var body = entries.length === 0
      ? '<div class="history-empty">Nothing logged yet.</div>'
      : entries.map(historyEntryHTML).join('');
    return '<div class="modal" role="dialog" aria-modal="true">'
      + '<div class="modal-head"><h2>'+title+'</h2><button class="close-x" data-action="close-overlay">&times;</button></div>'
      + '<div class="modal-body">'+body+'</div>'
      + '</div>';
  }

  /* ---------------- overlays ---------------- */

  function renderOverlay(){
    var existing = document.getElementById('overlayRoot');
    if (existing) existing.remove();
    if (!state.overlay) return;

    var root = document.createElement('div');
    root.id = 'overlayRoot';
    root.className = 'overlay';
    root.setAttribute('data-action','overlay-backdrop');

    if (state.overlay.type === 'newEntry'){
      root.innerHTML = newEntryModalHTML(state.overlay.menteeId, state.overlay.baseline);
    } else if (state.overlay.type === 'history'){
      root.innerHTML = state.overlay.loading
        ? '<div class="modal"><div class="modal-body" style="text-align:center;padding:40px;">Loading&hellip;</div></div>'
        : historyModalHTML(state.overlay.menteeId, state.overlay.entries);
    }
    document.body.appendChild(root);

    if (state.overlay.type === 'newEntry') wireEntryForm(root);
  }

  /* ---------------- event delegation ---------------- */

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');

    if (action === 'select-mentee-self'){
      var id = t.getAttribute('data-id');
      state.menteeId = id;
      try { localStorage.setItem('caselog.menteeId', id); } catch(err){}
      render();
    }
    else if (action === 'switch-mentee'){
      state.menteeId = null;
      state.confirmation = null;
      try { localStorage.removeItem('caselog.menteeId'); } catch(err){}
      render();
    }
    else if (action === 'log-another'){ state.confirmation = null; render(); }
    else if (action === 'new-entry'){ openNewEntryOverlay(t.getAttribute('data-id')); }
    else if (action === 'view-history'){
      var mid = t.getAttribute('data-id');
      if (mid) openHistoryOverlay(mid);
    }
    else if (action === 'close-overlay'){ state.overlay = null; render(); }
    else if (action === 'overlay-backdrop'){ if (e.target.id === 'overlayRoot'){ state.overlay = null; render(); } }
    else if (action === 'toggle-case'){
      var row = t.closest('.case-row');
      if (row) row.classList.toggle('open');
    }
  });

  init();
})();
</script>
</body>
</html>
