<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg: #F5F3EC;
    --surface: #FFFFFF;
    --surface-2: #EAE6D9;
    --border: #DBD5C3;
    --ink: #211D16;
    --ink-muted: #6E6455;
    --ink-faint: #9A917E;
    --accent: #24406B;
    --accent-ink: #FFFFFF;
    --accent-soft: #DEE6EF;
    --good: #0ca30c;
    --good-text: #006300;
    --warn: #b9791c;
    --low: #b23b34;
    --series-ps: #2a78d6;
    --series-an: #eb6834;
    --series-comm: #1baf7a;
    --series-biz: #eda100;
    --chart-grid: #e3ddcb;
    --chart-axis: #c7c0ac;
    --shadow: 0 1px 2px rgba(33,29,22,0.06), 0 8px 24px -12px rgba(33,29,22,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #14171C;
      --surface: #1B1F26;
      --surface-2: #20252D;
      --border: #313844;
      --ink: #ECEAE2;
      --ink-muted: #A6ACB6;
      --ink-faint: #767E89;
      --accent: #7DA1D6;
      --accent-ink: #0E1A2B;
      --accent-soft: #22344B;
      --good: #3FAE6E;
      --good-text: #6FCB94;
      --warn: #E0A542;
      --low: #E0685F;
      --series-ps: #3987e5;
      --series-an: #d95926;
      --series-comm: #199e70;
      --series-biz: #c98500;
      --chart-grid: #2a3038;
      --chart-axis: #3a4048;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #14171C;
    --surface: #1B1F26;
    --surface-2: #20252D;
    --border: #313844;
    --ink: #ECEAE2;
    --ink-muted: #A6ACB6;
    --ink-faint: #767E89;
    --accent: #7DA1D6;
    --accent-ink: #0E1A2B;
    --accent-soft: #22344B;
    --good: #3FAE6E;
    --good-text: #6FCB94;
    --warn: #E0A542;
    --low: #E0685F;
    --series-ps: #3987e5;
    --series-an: #d95926;
    --series-comm: #199e70;
    --series-biz: #c98500;
    --chart-grid: #2a3038;
    --chart-axis: #3a4048;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family:"Fraunces", Georgia, serif; font-weight:600; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .num{ font-variant-numeric: tabular-nums; }
  a{ color: inherit; }
  button{ font: inherit; color: inherit; }
  code{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.9em; }

  .topbar{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px;
    padding: 14px 24px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .wordmark{ display:flex; align-items:baseline; gap:8px; }
  .wordmark .mark{ font-family:"Fraunces"; font-weight:700; font-size:1.35rem; letter-spacing:-0.01em; }
  .wordmark .tag{ font-size:0.72rem; color: var(--ink-faint); letter-spacing:0.03em; }
  .topbar-right{ display:flex; align-items:center; gap:14px; font-size:0.88rem; }
  .who{ display:flex; align-items:center; gap:8px; color: var(--ink-muted); }
  .who b{ color: var(--ink); font-weight:600; }
  .linklike{ background:none; border:none; padding:0; cursor:pointer; color: var(--accent); font-weight:600; font-size:0.85rem; text-decoration: underline; text-underline-offset:2px; }
  .linklike:hover{ opacity:0.8; }

  main{ max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    border-radius: 8px; border: 1px solid var(--border);
    padding: 10px 16px; font-weight:600; font-size:0.9rem;
    background: var(--surface); cursor:pointer;
  }
  .btn:hover{ border-color: var(--ink-faint); }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover{ opacity:0.92; }
  .btn-small{ padding:6px 12px; font-size:0.82rem; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  input[type=text], input[type=date], select, textarea{
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px;
    width:100%;
  }
  textarea{ resize: vertical; min-height: 72px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  label{ font-size:0.82rem; font-weight:600; color: var(--ink-muted); display:block; margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .field-row > .field{ flex:1; min-width:160px; }

  /* --- picker / simple pages --- */
  .picker-wrap{ max-width: 560px; margin: 10vh auto 0; padding: 0 24px; text-align:center; }
  .picker-wrap h1{ font-size: 2rem; margin-bottom:6px; }
  .picker-wrap p{ color: var(--ink-muted); margin: 0 0 28px; }
  .mentor-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .mentor-chip{
    padding: 14px 10px; border-radius: 10px; border:1px solid var(--border);
    background: var(--surface); cursor:pointer; font-weight:600; font-size:0.95rem;
    box-shadow: var(--shadow);
  }
  .mentor-chip:hover{ border-color: var(--accent); color: var(--accent); }
  .back-link{ margin-bottom:18px; }

  .section-sub{ font-size:0.82rem; color: var(--ink-faint); margin: -6px 0 14px; }

  .receipt-list{ text-align:left; }
  .receipt-item{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
  .receipt-item:last-child{ border-bottom:none; }

  .scorer-tag{ font-size:0.72rem; color: var(--ink-faint); font-style:italic; white-space:nowrap; }

  /* --- roster --- */
  .roster-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom: 22px; flex-wrap:wrap; }
  .roster-head h1{ font-size:1.7rem; }
  .roster-head .count{ color: var(--ink-muted); font-size:0.95rem; }
  .mentee-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .mentee-card{
    background: var(--surface); border:1px solid var(--border); border-radius:12px;
    padding: 16px 16px 14px; box-shadow: var(--shadow); cursor:pointer;
    display:flex; flex-direction:column; gap:10px;
  }
  .mentee-card:hover{ border-color: var(--accent); }
  .mentee-card .name{ font-family:"Fraunces"; font-weight:600; font-size:1.12rem; }
  .mentee-card .meta{ color: var(--ink-faint); font-size:0.78rem; }
  .mentee-card .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .spark{ display:block; }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    border-radius:999px; padding: 3px 10px 3px 8px; font-size:0.78rem; font-weight:600;
    border:1px solid transparent; white-space:nowrap;
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .badge-good{ background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-text); }
  .badge-good .dot{ background: var(--good); }
  .badge-warn{ background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .badge-warn .dot{ background: var(--warn); }
  .badge-low{ background: color-mix(in srgb, var(--low) 14%, transparent); color: var(--low); }
  .badge-low .dot{ background: var(--low); }
  .badge-none{ background: var(--surface-2); color: var(--ink-faint); }
  .badge-none .dot{ background: var(--ink-faint); }

  .empty-note{ color: var(--ink-faint); font-size:0.82rem; font-style:italic; }

  /* --- mentee detail (mentor view) --- */
  .breadcrumb{ margin-bottom:18px; }
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
  .detail-head h1{ font-size:1.9rem; margin-bottom:4px; }
  .detail-head .pod{ color: var(--ink-muted); font-size:0.9rem; }
  .stat-line{ display:flex; gap:22px; margin-top:10px; flex-wrap:wrap; }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .v{ font-family:"IBM Plex Mono"; font-size:1.5rem; font-weight:600; }
  .stat .l{ font-size:0.72rem; color: var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; }
  .delta{ font-size:0.82rem; font-weight:600; }
  .delta.up{ color: var(--good-text); }
  .delta.down{ color: var(--low); }
  .delta.flat{ color: var(--ink-faint); }

  .card{ background: var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow: var(--shadow); }
  .chart-card{ padding: 20px 20px 8px; margin-bottom: 26px; }
  .chart-card .card-title{ font-size:0.95rem; font-weight:600; margin-bottom:2px; }
  .chart-card .card-sub{ font-size:0.78rem; color: var(--ink-faint); margin-bottom:6px; }
  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin: 6px 0 10px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:0.78rem; color: var(--ink-muted); }
  .legend-swatch{ width:16px; height:3px; border-radius:2px; }
  .legend-swatch.overall{ height:4px; }
  .chart-wrap{ position:relative; }
  .chart-empty{ padding: 40px 10px 30px; text-align:center; color: var(--ink-muted); }
  .tooltip{
    position:absolute; pointer-events:none; background: var(--ink); color: var(--bg);
    border-radius:8px; padding:9px 11px; font-size:0.76rem; line-height:1.5; box-shadow: var(--shadow);
    transform: translate(-50%, -110%); white-space:nowrap; z-index:5; opacity:0; transition: opacity 0.1s;
  }
  :root:not([data-theme="light"]) .tooltip{ background: var(--surface-2); color: var(--ink); border:1px solid var(--border); }
  :root[data-theme="dark"] .tooltip{ background: var(--surface-2); color: var(--ink); border:1px solid var(--border); }
  .tooltip .t-date{ font-weight:700; margin-bottom:3px; font-family:"IBM Plex Mono"; }
  .tooltip .t-row{ display:flex; align-items:center; gap:6px; }
  .tooltip .t-row .sw{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .section-title{ font-size:1.1rem; margin: 30px 0 12px; display:flex; align-items:baseline; justify-content:space-between; }
  .history-empty{ padding: 30px; text-align:center; color: var(--ink-muted); border:1px dashed var(--border); border-radius:12px; }

  .case-row{ border:1px solid var(--border); border-radius:12px; background: var(--surface); margin-bottom:10px; overflow:hidden; }
  .case-row.pending-case{ opacity:0.65; }
  .case-row.pending-case .case-row-head{ cursor:default; }
  .case-row-head{ display:flex; align-items:center; gap:14px; padding:13px 16px; cursor:pointer; flex-wrap:wrap; }
  .case-row-head:hover{ background: var(--surface-2); }
  .case-row .date{ font-family:"IBM Plex Mono"; font-size:0.82rem; color: var(--ink-muted); min-width:82px; }
  .case-row .cname{ font-weight:600; flex:1; min-width:120px; }
  .case-row .chevron{ transition: transform 0.15s; color: var(--ink-faint); margin-left:auto; }
  .case-row.open .chevron{ transform: rotate(90deg); }
  .case-row-body{ display:none; padding: 6px 18px 18px; border-top:1px solid var(--border); }
  .case-row.open .case-row-body{ display:block; }
  .cat-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:16px; margin-top:12px; }
  .cat-block .cat-name{ font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .cat-block .sw{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .metric-line{ display:flex; justify-content:space-between; font-size:0.85rem; padding:3px 0; color: var(--ink-muted); gap:10px; }
  .metric-line b{ color: var(--ink); font-family:"IBM Plex Mono"; }
  .case-notes{ margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:0.88rem; color: var(--ink-muted); white-space:pre-wrap; }
  .case-notes .l{ display:block; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color: var(--ink-faint); margin-bottom:4px; }

  /* --- overlay/modal --- */
  .overlay{ position:fixed; inset:0; background: rgba(20,17,10,0.45); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding: 5vh 20px; overflow-y:auto; }
  :root:not([data-theme="light"]) .overlay{ background: rgba(0,0,0,0.6); }
  :root[data-theme="dark"] .overlay{ background: rgba(0,0,0,0.6); }
  .modal{ background: var(--surface); border-radius:16px; width:100%; max-width:640px; box-shadow: var(--shadow); border:1px solid var(--border); }
  .modal.wide{ max-width: 740px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 18px 22px; }
  .modal-head h2{ font-size:1.25rem; }
  .modal-body{ padding: 8px 22px 24px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding: 14px 22px; border-top:1px solid var(--border); }
  .close-x{ background:none; border:none; cursor:pointer; color: var(--ink-faint); font-size:1.3rem; line-height:1; padding:4px; }
  .close-x:hover{ color: var(--ink); }

  .admin-tabs{ display:flex; gap:22px; padding: 0 22px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .admin-tab-btn{ background:none; border:none; padding:0 0 11px; font-weight:600; font-size:0.85rem; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .admin-tab-btn.active{ color: var(--ink); border-bottom-color: var(--accent); }
  .admin-tab-btn:hover{ color: var(--ink); }

  fieldset{ border:1px solid var(--border); border-radius:10px; padding: 14px 16px 14px; margin: 0 0 14px; }
  legend{ font-size:0.8rem; font-weight:700; padding:0 6px; color: var(--ink); display:flex; align-items:center; gap:6px; }
  legend .sw{ width:9px; height:9px; border-radius:50%; }

  .case-mode-toggle{ display:flex; gap:18px; flex-wrap:wrap; margin: 0 0 16px; font-size:0.85rem; }
  .case-mode-toggle label{ display:flex; align-items:center; gap:6px; font-weight:500; color: var(--ink); margin:0; }

  .rubric-banner{
    font-size:0.82rem; line-height:1.5; color: var(--ink-muted);
    background: var(--accent-soft); border-radius:10px; padding:12px 14px; margin: 0 0 16px;
  }
  .rubric-banner b{ color: var(--ink); }

  .rubric-hint{ font-size:0.78rem; color: var(--ink-faint); margin-bottom:10px; }
  .cat-slider-row{ display:flex; align-items:center; gap:12px; }
  .cat-slider-row input[type=range]{ flex:1; accent-color: var(--accent); }
  .cat-slider-row .val{ font-family:"IBM Plex Mono"; font-weight:600; min-width:28px; text-align:right; }
  .na-toggle{ display:flex; align-items:center; gap:5px; font-size:0.78rem; font-weight:500; color: var(--ink-muted); white-space:nowrap; margin:0; }
  .na-toggle input{ margin:0; }
  .anchor-list{ display:flex; flex-direction:column; gap:4px; margin-top:10px; }
  .anchor-item{ display:flex; gap:9px; font-size:0.78rem; color: var(--ink-faint); line-height:1.4; }
  .anchor-item b{ color: var(--ink-muted); min-width:14px; flex-shrink:0; }
  .rationale-row{ margin: 12px 0 2px; padding:10px 12px; background: var(--surface-2); border-radius:8px; }
  .rationale-row label{ margin-bottom:6px; }
  .block-msg{ font-size:0.78rem; color: var(--low); margin-right:auto; align-self:center; }

  .roster-admin-list{ display:flex; flex-direction:column; gap:14px; max-height: 360px; overflow-y:auto; margin-bottom:18px; padding-right:4px; }
  .admin-mentor-block{ border:1px solid var(--border); border-radius:9px; padding:6px 12px 8px; }
  .admin-row{ display:flex; align-items:center; gap:8px; padding:6px 2px; }
  .admin-row-mentor{ padding-top:8px; padding-bottom:7px; border-bottom:1px solid var(--border); margin-bottom:4px; font-weight:700; font-size:0.92rem; }
  .roster-mentee-count{ font-size:0.76rem; color: var(--ink-faint); white-space:nowrap; margin-left:auto; }
  .divider{ border:none; border-top:1px solid var(--border); margin: 18px 0; }
  .hint{ font-size:0.78rem; color: var(--ink-faint); margin-top:-6px; margin-bottom:14px; }

  .cohort-summary{ display:flex; gap:28px; margin-bottom:18px; flex-wrap:wrap; }

  .admin-mentee-row{ display:flex; align-items:center; gap:12px; padding:7px 0; font-size:0.85rem; border-bottom:1px solid var(--border); }
  .admin-mentee-row:last-child{ border-bottom:none; }
  .admin-mentee-row .n{ font-weight:600; flex:1; min-width:100px; }
  .admin-mentee-row .meta{ color: var(--ink-faint); font-size:0.78rem; min-width:64px; text-align:right; }

  .conn-banner{ max-width:560px; margin: 14vh auto 0; padding:24px; text-align:center; color: var(--ink-muted); }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg); padding:11px 18px; border-radius:10px;
    font-size:0.85rem; box-shadow: var(--shadow); opacity:0; transition: opacity 0.18s, transform 0.18s;
    z-index:100; pointer-events:none; max-width: min(90vw, 420px); text-align:center;
  }
  :root:not([data-theme="light"]) .toast{ background: var(--surface-2); color: var(--ink); border:1px solid var(--border); }
  :root[data-theme="dark"] .toast{ background: var(--surface-2); color: var(--ink); border:1px solid var(--border); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 560px){
    .topbar{ padding: 12px 16px; }
    main{ padding: 22px 16px 60px; }
    .cat-slider-row{ flex-wrap:wrap; }
    .na-toggle{ flex-basis:100%; }
    .admin-mentee-row .meta{ min-width:auto; }
  }
</style>

</head>
<body>

<div id="topbar" class="topbar">
  <div class="wordmark">
    <span class="mark">Casebook</span>
    <span class="tag">case interview coaching, scored</span>
  </div>
  <div class="topbar-right">
    <span id="whoBox" class="who" hidden><span id="whoLabel"></span> <b id="whoName"></b></span>
    <button class="linklike" id="adminBtn" hidden>admin</button>
  </div>
</div>

<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script>
(function(){
  "use strict";

  // Fill these in from Firebase console > Project settings > General > Your apps.
  // This config is public by design (it names the project, not a secret) — see README.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB98nxRs2SkBqR1NeNvcwuPrWdUh4YK36Q",
    authDomain: "ca-casing-tracker.firebaseapp.com",
    projectId: "ca-casing-tracker",
    storageBucket: "ca-casing-tracker.firebasestorage.app",
    messagingSenderId: "499490855868",
    appId: "1:499490855868:web:824ab3b8f71625009e69b9"
  };

  /* ---------------- domain model ---------------- */

  // `metrics` render as rubric hint text under each category's single
  // slider (they are no longer individually scored). `anchors` are
  // criterion text at the 3/5/7/9 scale points, scored against a real
  // interview bar, not against how far into the program this is (see
  // the rubric banner in newCaseModalHTML): 8+ means interview-ready
  // today, full stop — the same case gets the same score in week 1 or
  // week 10, so the trend line is what shows the progress.
  var CATEGORIES = [
    { key:'ps', label:'Problem Solving & Framework', short:'Problem solving', color:'var(--series-ps)',
      metrics:[
        {key:'clearProblem', label:'Clear problem statement'},
        {key:'logicalStructure', label:'Logical structure'},
        {key:'creativity', label:'Creativity'},
        {key:'mece', label:'MECE'}
      ],
      anchors: {
        3: 'No real framework — jumps to solutions or restates the prompt instead of structuring it.',
        5: 'Structure is present but generic or overlapping; needs real-time correction to hold up.',
        7: 'Solid structure covers the case; a gap or two, but recovers without help.',
        9: 'Tight, MECE, tailored to this prompt; drives the whole case without prompting.'
      }
    },
    { key:'analytical', label:'Analytical Skills', short:'Analytical', color:'var(--series-an)',
      metrics:[
        {key:'accuracy', label:'Accuracy with exhibits'},
        {key:'speed', label:'Speed to insight'},
        {key:'calculations', label:'Calculations'},
        {key:'detail', label:'Attention to detail'}
      ],
      anchors: {
        3: 'Math errors go uncaught, or an exhibit is misread in a way that changes the answer.',
        5: 'Calculations work but are slow or need rework; misses a detail at least once.',
        7: 'Gets to the right number with minor slips; exhibit reads are generally accurate.',
        9: 'Reads exhibits correctly the first time, math is clean and fast, catches the "so what."'
      }
    },
    { key:'comm', label:'Communication & Delivery', short:'Communication', color:'var(--series-comm)',
      metrics:[
        {key:'clarity', label:'Clarity'},
        {key:'confidence', label:'Confidence & poise'},
        {key:'adapts', label:'Adapts to feedback'},
        {key:'guides', label:'Guides you through their thinking'}
      ],
      anchors: {
        3: 'Hard to follow; works through the case silently or without narrating the thinking.',
        5: 'Understandable but rambling or passive — you’re doing more steering than they are.',
        7: 'Clear and organized; mostly leads the conversation, occasionally needs a prompt to synthesize.',
        9: 'Talks like a real consultant — structured, confident, checks in without being asked to.'
      }
    },
    { key:'biz', label:'Business Judgment & Recommendation', short:'Business judgment', color:'var(--series-biz)',
      metrics:[
        {key:'strength', label:'Strength of the answer'},
        {key:'relevance', label:'Relevance'},
        {key:'risks', label:'Risks & trade-offs'}
      ],
      anchors: {
        3: 'No clear recommendation, or one that contradicts the analysis.',
        5: 'Recommendation is reasonable but generic or loosely tied to what was actually found.',
        7: 'Sound recommendation grounded in the numbers; trade-offs mentioned but not fully explored.',
        9: 'Decisive, tied directly to the analysis, and names the risk that would change the call.'
      }
    }
  ];

  /**
   * catAvg reads BOTH score shapes: current documents store one number
   * (or null for "not observed") per category; any document from before
   * the 15-metric-to-4-category collapse would still store an object of
   * sub-metric scores. Null propagates — a category nobody scored is
   * unknown, not zero.
   */
  function catAvg(scores, catKey){
    var raw = scores ? scores[catKey] : undefined;
    if (raw === null || raw === undefined) return null;
    if (typeof raw === 'number') return raw;
    if (typeof raw === 'object'){
      var cat = CATEGORIES.filter(function(c){ return c.key===catKey; })[0];
      var vals = cat.metrics
        .map(function(m){ return raw[m.key]; })
        .filter(function(v){ return v !== null && v !== undefined && v !== ''; })
        .map(Number);
      if (!vals.length) return null;
      return vals.reduce(function(a,b){ return a+b; },0) / vals.length;
    }
    return null;
  }
  function overallAvg(scores){
    var vals = CATEGORIES.map(function(c){ return catAvg(scores, c.key); }).filter(function(v){ return v !== null; });
    if (!vals.length) return null;
    return vals.reduce(function(a,b){ return a+b; },0) / vals.length;
  }
  function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
  function fmt1OrDash(n){ return (n === null || n === undefined) ? '&mdash;' : fmt1(n); }

  // Matches the rubric banner in newCaseModalHTML: 8+ is the
  // interview-ready bar, on an absolute scale — not relative to how
  // far into the program this score was logged.
  function scoreBand(n){
    if (n >= 8) return { cls:'good', label:'Interview ready' };
    if (n >= 5) return { cls:'warn', label:'Developing' };
    return { cls:'low', label:'Needs work' };
  }
  function badgeHTML(n){
    if (n === null || n === undefined) return '<span class="badge badge-none"><span class="dot"></span>&mdash;</span>';
    var b = scoreBand(n);
    return '<span class="badge badge-'+b.cls+'"><span class="dot"></span>'+fmt1(n)+' &middot; '+b.label+'</span>';
  }
  function isValidRationale(text){
    var trimmed = (text || '').trim();
    var nonWhitespace = trimmed.replace(/\s/g, '');
    if (nonWhitespace.length < 10) return false;
    if (!/[a-zA-Z0-9]/.test(trimmed)) return false;
    return true;
  }
  function inBand(v){ return v >= 4 && v <= 6; }

  var toastTimeout = null;
  function showToast(msg){
    var el = document.getElementById('toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function(){ el.classList.remove('show'); }, 3200);
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso){
    var parts = iso.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year: 'numeric' });
  }
  function fmtDateShort(iso){
    var parts = iso.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function isoFromDate(d){
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }
  function todayISO(){ return isoFromDate(new Date()); }

  /* ---------------- state ---------------- */

  var state = {
    db: null,
    mode: undefined,            // undefined=detecting | 'mentor' | 'mentee' | 'invalid-link'
    mentors: [],
    mentees: [],
    // mentor mode
    mentorId: null,
    isAdmin: false,
    podEvaluations: [],         // live, where('primaryMentorId','==',mentorId) — includes cross-pod scorers of this pod
    selfEvalCache: {},          // caseId -> self-eval doc | null (fetched one at a time, per blind-entry rules)
    selectedMenteeId: null,
    // admin (bulk, only subscribed when isAdmin)
    allEvaluations: [],
    allSelfEvaluations: [],
    adminTab: 'overview',
    // mentee mode
    menteeId: null,
    confirmation: null,         // { caseName, date } shown after a successful self-log
    // shared
    overlay: null                // null | 'admin' | 'pickMentee' | {type:'newCase', menteeId, source, availableCases}
  };

  var appEl = document.getElementById('app');
  var topbarEl = document.getElementById('topbar');
  var whoBox = document.getElementById('whoBox');
  var whoLabel = document.getElementById('whoLabel');
  var whoName = document.getElementById('whoName');
  var adminBtn = document.getElementById('adminBtn');

  function mentorById(id){ return state.mentors.filter(function(m){ return m.id===id; })[0]; }
  function menteeById(id){ return state.mentees.filter(function(m){ return m.id===id; })[0]; }
  function menteesForMentor(mentorId){ return state.mentees.filter(function(m){ return m.primaryMentorId===mentorId; }); }
  function podEvalsForMentee(menteeId){ return state.podEvaluations.filter(function(e){ return e.menteeId===menteeId; }); }
  function serverNow(){ return firebase.firestore.FieldValue.serverTimestamp(); }

  /* ---------------- receipts (mentee mode, local-only, section 7) ---------------- */

  function receiptsKey(menteeId){ return 'casebook.receipts.'+menteeId; }
  function loadReceipts(menteeId){
    try {
      var raw = localStorage.getItem(receiptsKey(menteeId));
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }
  function addReceipt(menteeId, entry){
    try {
      var list = loadReceipts(menteeId);
      list.unshift(entry);
      localStorage.setItem(receiptsKey(menteeId), JSON.stringify(list.slice(0, 20)));
    } catch(e){}
  }

  /* ---------------- init / routing / auth ---------------- */

  function init(){
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      state.db = firebase.firestore();
    } catch(e){
      console.error('firebase init failed', e);
      state.mode = 'invalid-link';
      render();
      return;
    }

    subscribePublicRoster();

    var params = new URLSearchParams(window.location.search);
    var m = params.get('m');
    var t = params.get('t');
    var a = params.get('a');

    if (m){
      bootstrapMentor(m, t, a === '1' || a === 'true');
    } else {
      state.mode = 'mentee';
      try {
        var savedMentee = localStorage.getItem('casebook.menteeId');
        if (savedMentee) state.menteeId = savedMentee;
      } catch(e){}
      render();
    }
  }

  function subscribePublicRoster(){
    state.db.collection('mentees').orderBy('name').onSnapshot(function(snap){
      state.mentees = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('mentees sub failed', err); });
    state.db.collection('mentors').orderBy('name').onSnapshot(function(snap){
      state.mentors = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('mentors sub failed', err); });
  }

  /**
   * Anonymous auth persists across visits in the same browser, so a
   * returning mentor reaches the SAME uid without needing `t` again —
   * routing only requires `m`, and this only requires `t` the first
   * time (when no session doc exists yet). isAdmin is always read back
   * from the stored session doc, never trusted fresh from the URL.
   */
  function bootstrapMentor(mentorId, token, claimedAdmin){
    function createSession(uid){
      var payload = { token: token, mentorId: mentorId, isAdmin: !!claimedAdmin };
      return state.db.collection('mentorSessions').doc(uid).set(payload).then(function(){ return payload; });
    }

    firebase.auth().signInAnonymously().then(function(cred){
      var uid = cred.user.uid;
      return state.db.collection('mentorSessions').doc(uid).get().then(function(snap){
        if (!snap.exists){
          if (!token) return Promise.reject(new Error('no existing session and no token in the URL'));
          return createSession(uid);
        }
        if (token && snap.data().token !== token){
          // The URL carries a token that doesn't match this browser's
          // stored session — the session was issued against a token that
          // has since been rotated (revoked). mentorSessions has no client
          // update path by design, so there is nothing to "refresh": drop
          // this anonymous identity and mint a fresh one tied to the new
          // token instead of getting stuck silently failing every read.
          return firebase.auth().signOut()
            .then(function(){ return firebase.auth().signInAnonymously(); })
            .then(function(freshCred){ return createSession(freshCred.user.uid); });
        }
        return snap.data();
      });
    }).then(function(sessionData){
      state.mode = 'mentor';
      state.mentorId = sessionData.mentorId;
      state.isAdmin = !!sessionData.isAdmin;
      try {
        var url = new URL(window.location.href);
        if (url.searchParams.has('t')){
          url.searchParams.delete('t');
          history.replaceState({}, '', url.toString());
        }
      } catch(e){}
      subscribeMentorPod();
      if (state.isAdmin) subscribeAdminBulk();
      render();
    }).catch(function(err){
      console.error('mentor bootstrap failed', err);
      state.mode = 'invalid-link';
      render();
    });
  }

  function subscribeMentorPod(){
    state.db.collection('evaluations')
      .where('primaryMentorId','==',state.mentorId)
      .orderBy('createdAt','desc')
      .limit(5000)
      .onSnapshot(function(snap){
        state.podEvaluations = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
        fetchSelfEvalsForCalibration();
      }, function(err){ console.error('pod evaluations sub failed', err); });
  }

  function subscribeAdminBulk(){
    state.db.collection('evaluations').orderBy('createdAt','desc').limit(5000).onSnapshot(function(snap){
      state.allEvaluations = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('admin evaluations sub failed', err); });
    state.db.collection('selfEvaluations').orderBy('createdAt','desc').limit(5000).onSnapshot(function(snap){
      state.allSelfEvaluations = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('admin self-evaluations sub failed', err); });
  }

  /**
   * Blind entry means a mentor has no bulk read of selfEvaluations —
   * only a single-document get(), and only for a case they have
   * personally scored. This fetches exactly those, one doc at a time,
   * caching results (including "doesn't exist yet") so a re-render
   * doesn't refetch what's already known.
   */
  function fetchSelfEvalsForCalibration(){
    var caseIds = Array.from(new Set(
      state.podEvaluations
        .filter(function(e){ return e.scorerId === state.mentorId && e.caseId; })
        .map(function(e){ return e.caseId; })
    ));
    var pending = caseIds.filter(function(id){ return !(id in state.selfEvalCache); });
    if (!pending.length) return;
    Promise.all(pending.map(function(caseId){
      return state.db.collection('selfEvaluations').doc(caseId).get().then(function(snap){
        state.selfEvalCache[caseId] = snap.exists ? Object.assign({id:snap.id}, snap.data()) : null;
      }).catch(function(){
        state.selfEvalCache[caseId] = null; // not revealed yet (or genuinely absent) — same UI either way
      });
    })).then(render);
  }

  /* ---------------- rendering: shell ---------------- */

  function updateTopbar(){
    if (state.mode === 'mentor' && state.mentorId){
      var mentor = mentorById(state.mentorId);
      whoBox.hidden = false;
      whoLabel.textContent = 'Pod lead:';
      whoName.textContent = mentor ? mentor.name : state.mentorId;
      adminBtn.hidden = !state.isAdmin;
    } else {
      whoBox.hidden = true;
      adminBtn.hidden = true;
    }
  }

  function render(){
    updateTopbar();

    if (state.mode === undefined){
      appEl.innerHTML = '<div class="conn-banner">Connecting&hellip;</div>';
    } else if (state.mode === 'invalid-link'){
      appEl.innerHTML = '<div class="conn-banner"><h1 style="font-size:1.4rem;margin-bottom:10px;">This link isn’t valid</h1><p>Contact the program chairs for a working link.</p></div>';
    } else if (state.mode === 'mentor'){
      appEl.innerHTML = state.selectedMenteeId ? menteeDetailHTML(state.selectedMenteeId) : rosterHTML();
    } else {
      if (!state.menteeId) appEl.innerHTML = menteePickerHTML();
      else if (state.confirmation) appEl.innerHTML = confirmationHTML();
      else appEl.innerHTML = menteeHomeHTML(state.menteeId);
    }

    renderOverlay();

    if (state.overlay === null && state.mode === 'mentor' && state.selectedMenteeId){
      drawChart(podEvalsForMentee(state.selectedMenteeId), 'chartWrap');
    }
  }

  /* ---------------- mentee mode ---------------- */

  function menteePickerHTML(){
    var list = state.mentees.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    if (list.length === 0){
      return '<div class="picker-wrap"><h1>No mentees on the roster yet</h1><p>Check back once your program has been set up.</p></div>';
    }
    return '<div class="picker-wrap">'
      + '<h1>Find your name</h1>'
      + '<p>Pick yourself to log your own cases.</p>'
      + '<div class="mentor-grid">'
      + list.map(function(m){
          return '<button class="mentor-chip" data-action="select-mentee-self" data-id="'+esc(m.id)+'">'+esc(m.name)+'</button>';
        }).join('')

      + '</div>';

  function menteeHomeHTML(menteeId){

      + '<p style="margin-top:22px;"><button class="linklike" data-action="switch-mentee">not you? pick again</button></p>'
      + (receipts.length
          ? '<div class="receipt-list"><div class="section-title" style="margin-top:30px;">Sessions you’ve logged on this device</div>'
            + receipts.map(function(r){
                return '<div class="receipt-item"><span>'+(r.caseName ? esc(r.caseName) : '<span class="empty-note">untitled case</span>')+'</span><span class="mono num">'+esc(fmtDateShort(r.date))+'</span></div>';
              }).join('')

      + '</div>';

  function confirmationHTML(){
    var c = state.confirmation || {};
    return '<div class="picker-wrap">'
      + '<h1>Logged</h1>'
      + '<p>'+(c.caseName ? esc(c.caseName) : 'Your case')+' is saved. Nice work.</p>'

      + '</div>';
  }

  /* ---------------- mentor mode: roster ---------------- */

  function sparklinePath(vals, w, h){
    if (vals.length < 2) return null;
    var min = 1, max = 10;
    var stepX = w / (vals.length - 1);
    var pts = vals.map(function(v,i){
      var x = i*stepX;
      var y = h - ((v-min)/(max-min))*h;
      return [x,y];
    });
    return pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  }

  function rosterHTML(){
    var mentor = mentorById(state.mentorId);
    var mentees = menteesForMentor(state.mentorId);
    var cards = mentees.map(function(mt){
      var evals = podEvalsForMentee(mt.id).slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
      var n = evals.length;
      var latest = n ? overallAvg(evals[n-1].scores) : null;
      var sparkVals = evals.slice(-8).map(function(e){ return overallAvg(e.scores); }).filter(function(v){ return v !== null; });
      var path = sparklinePath(sparkVals, 84, 24);
      var lastDate = n ? fmtDateShort(evals[n-1].date) : null;
      return '<div class="mentee-card" data-action="open-mentee" data-id="'+esc(mt.id)+'">'
        + '<div class="row"><span class="name">'+esc(mt.name)+'</span>'
        + (latest!==null ? '<span class="badge badge-'+scoreBand(latest).cls+'"><span class="dot"></span>'+fmt1(latest)+'</span>' : '<span class="badge badge-none"><span class="dot"></span>&mdash;</span>')
        + '</div>'
        + '<div class="row">'
        + (path
            ? '<svg class="spark" width="84" height="24" viewBox="0 0 84 24"><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            : '<span class="empty-note">'+(n ? 'one case so far' : 'no cases logged')+'</span>')
        + '<span class="meta">'+n+' case'+(n===1?'':'s')+(lastDate ? ' &middot; last '+lastDate : '')+'</span>'
        + '</div>'
        + '</div>';
    }).join('');

    return '<div class="roster-head">'
      + '<div><h1>'+esc(mentor ? mentor.name : '')+'’s pod</h1></div>'
      + '<span class="count">'+mentees.length+' mentee'+(mentees.length===1?'':'s')+'</span>'
      + '</div>'
      + '<div class="mentee-grid">'
      + cards
      + '</div>'
      + '<p style="margin-top:20px;"><button class="linklike" data-action="score-any-mentee">+ score a mentee outside your pod</button></p>';
  }

  /* ---------------- shared case history rows ---------------- */

  function catDetailHTML(ev, c){
    var raw = ev.scores ? ev.scores[c.key] : undefined;
    var avgLabel = fmt1OrDash(catAvg(ev.scores, c.key));
    var header = '<div class="cat-name"><span class="sw" style="background:'+c.color+'"></span>'+c.short+' <span class="num" style="font-weight:400;color:var(--ink-faint)">('+avgLabel+')</span></div>';

    if (raw !== null && raw !== undefined && typeof raw === 'object'){
      return '<div class="cat-block">'+header
        + c.metrics.map(function(m){
            var v = raw[m.key];
            return '<div class="metric-line"><span>'+m.label+'</span><b class="num">'+(v===null||v===undefined||v==='' ? '&mdash;' : v)+'</b></div>';
          }).join('')
        + '</div>';
    }

    var rationaleText = ev.rationale && ev.rationale[c.key];
    return '<div class="cat-block">'+header
      + (raw === null || raw === undefined ? '<div class="metric-line"><span class="empty-note">Not observed</span></div>' : '')
      + (rationaleText ? '<div class="case-notes" style="margin-top:8px;padding-top:8px;"><span class="l">Why</span>'+esc(rationaleText)+'</div>' : '')
      + '</div>';
  }

  /** `tagFn`, if given, returns extra HTML injected into the row header
   * (used to flag a cross-pod scorer's name on a mentor's case-history row). */
  function caseRowsHTML(evals, emptyMsg, tagFn){
    if (evals.length === 0){
      return '<div class="history-empty">'+emptyMsg+'</div>';
    }
    return evals.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).map(function(ev, idx){
      var oa = overallAvg(ev.scores);
      return '<div class="case-row" data-case-idx="'+idx+'">'
        + '<div class="case-row-head" data-action="toggle-case">'
        + '<span class="date">'+fmtDate(ev.date)+'</span>'
        + '<span class="cname">'+(ev.caseName ? esc(ev.caseName) : '<span class="empty-note">untitled case</span>')+'</span>'
        + (tagFn ? (tagFn(ev) || '') : '')
        + badgeHTML(oa)
        + '<span class="chevron">▸</span>'
        + '</div>'
        + '<div class="case-row-body">'
        + '<div class="cat-grid">'
        + CATEGORIES.map(function(c){ return catDetailHTML(ev, c); }).join('')
        + '</div>'
        + (ev.notes ? '<div class="case-notes"><span class="l">Notes</span>'+esc(ev.notes)+'</div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
  }

  function pendingCaseRowHTML(ev){
    return '<div class="case-row pending-case">'
      + '<div class="case-row-head">'
      + '<span class="date">'+fmtDate(ev.date)+'</span>'
      + '<span class="cname">'+(ev.caseName ? esc(ev.caseName) : '<span class="empty-note">untitled case</span>')+'</span>'
      + '<span class="badge badge-none"><span class="dot"></span>pending</span>'
      + '</div>'
      + '</div>';
  }

  function statBlockHTML(evals){
    var sorted = evals.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var n = sorted.length;
    var latest = n ? overallAvg(sorted[n-1].scores) : null;
    var prev = n>1 ? overallAvg(sorted[n-2].scores) : null;
    var delta = (latest!==null && prev!==null) ? latest - prev : null;
    return '<div class="stat-line">'
      + '<div class="stat"><span class="v num">'+n+'</span><span class="l">Cases logged</span></div>'
      + (latest!==null ? '<div class="stat"><span class="v num">'+fmt1(latest)+'</span><span class="l">Latest overall</span></div>' : '')
      + (delta!==null ? '<div class="stat"><span class="v delta '+(delta>0.05?'up':delta<-0.05?'down':'flat')+'">'+(delta>0.05?'▲ +':delta<-0.05?'▼ ':'– ')+fmt1(Math.abs(delta))+'</span><span class="l">vs previous</span></div>' : '')
      + '</div>';
  }

  function chartOrEmptyHTML(evals, wrapId, emptyName){
    if (evals.length === 0){
      return '<div class="chart-empty">No cases logged yet for '+esc(emptyName)+'. Log the first one to start tracking progress.</div>';
    }
    return '<div class="legend">'
      + CATEGORIES.map(function(c){ return '<span class="legend-item"><span class="legend-swatch" style="background:'+c.color+'"></span>'+c.short+'</span>'; }).join('')
      + '<span class="legend-item"><span class="legend-swatch overall" style="background:var(--accent)"></span>Overall</span>'
      + '</div>'
      + '<div class="chart-wrap" id="'+wrapId+'"></div>';
  }

  /* ---------------- calibration ---------------- */

  function calibrationMath(pairs){
    if (!pairs.length) return null;
    function avg(arr){ return arr.length ? arr.reduce(function(a,b){ return a+b; },0)/arr.length : null; }
    var overallDeltas = [];
    var catDeltas = {};
    CATEGORIES.forEach(function(c){ catDeltas[c.key] = []; });
    pairs.forEach(function(p){
      CATEGORIES.forEach(function(c){
        var mv = catAvg(p.mentor.scores, c.key), sv = catAvg(p.self.scores, c.key);
        if (mv !== null && sv !== null) catDeltas[c.key].push(sv - mv);
      });
      var mo = overallAvg(p.mentor.scores), so = overallAvg(p.self.scores);
      if (mo !== null && so !== null) overallDeltas.push(so - mo);
    });
    return {
      n: pairs.length,
      overall: avg(overallDeltas),
      categories: CATEGORIES.map(function(c){ return { key:c.key, short:c.short, delta: avg(catDeltas[c.key]) }; })
    };
  }

  function pairsFromBulk(mentorEvals, selfEvals){
    var pairs = [];
    mentorEvals.filter(function(e){ return e.caseId; }).forEach(function(me){
      var se = selfEvals.filter(function(e){ return e.caseId === me.caseId; })[0];
      if (se) pairs.push({ mentor: me, self: se });
    });
    return pairs;
  }

  /** Only cases where the signed-in mentor personally scored can even be
   * checked (that is what grants read access), so this only ever builds
   * pairs from the mentor's own scorecards — never a colleague's. */
  function myCalibrationPairs(menteeId){
    var pairs = [];
    podEvalsForMentee(menteeId)
      .filter(function(e){ return e.scorerId === state.mentorId && e.caseId; })
      .forEach(function(e){
        var self = state.selfEvalCache[e.caseId];
        if (self) pairs.push({ mentor: e, self: self });
      });
    return pairs;
  }

  function calibDeltaHTML(delta){
    if (delta === null || delta === undefined) return '<span class="empty-note">&mdash;</span>';
    var a = Math.abs(delta);
    var colorVar = a <= 0.5 ? 'var(--good-text)' : (a <= 1.5 ? 'var(--warn)' : 'var(--low)');
    var sign = delta > 0 ? '+' : '';
    return '<span class="num" style="font-weight:700;color:'+colorVar+';">'+sign+fmt1(delta)+'</span>';
  }

  function calibrationCardHTML(pairs){
    var summary = calibrationMath(pairs);
    if (!summary) return '';
    return '<div class="card" style="padding:16px 20px;margin-bottom:26px;">'
      + '<div class="card-title">Calibration</div>'
      + '<div class="card-sub">Self-score minus your score, averaged across '+summary.n+' case'+(summary.n===1?'':'s')+' you both scored. Not shown to the mentee.</div>'
      + '<div class="stat-line">'
      + '<div class="stat">'+calibDeltaHTML(summary.overall)+'<span class="l">Overall</span></div>'
      + summary.categories.map(function(c){
          return '<div class="stat">'+calibDeltaHTML(c.delta)+'<span class="l">'+esc(c.short)+'</span></div>';
        }).join('')
      + '</div>'
      + '</div>';
  }

  /* ---------------- mentor mode: mentee detail ---------------- */

  function menteeDetailHTML(menteeId){
    var mentee = menteeById(menteeId);
    if (!mentee){
      return '<p>Mentee not found.</p>';
    }
    var mentor = mentorById(mentee.primaryMentorId);

    var myScoredCases = evals.filter(function(e){ return e.scorerId === state.mentorId && e.caseId; });

    } else {
      selfSectionHTML = myScoredCases.map(function(e){
        var cached = state.selfEvalCache[e.caseId];

      }).join('');

    return '<div class="breadcrumb"><button class="linklike" data-action="back-to-roster">← '+esc(mentor ? mentor.name+'’s pod' : 'pod')+'</button></div>'
      + '<div class="detail-head">'
      + '<div><h1>'+esc(mentee.name)+'</h1><div class="pod">mentee of '+esc(mentor ? mentor.name : '—')+'</div>'+statBlockHTML(evals)+'</div>'
      + '<button class="btn btn-primary" data-action="new-case" data-id="'+esc(menteeId)+'">+ Log a case</button>'
      + '</div>'
      + '<div class="card chart-card">'
      + '<div class="card-title">Performance over time</div>'
      + '<div class="card-sub">Category averages by case, 1&ndash;10 scale.</div>'
      + chartOrEmptyHTML(evals, 'chartWrap', mentee.name)
      + '</div>'
      + calibrationCardHTML(pairs)
      + '<div class="section-title">Case history</div>'
      + caseRowsHTML(evals, 'Nothing here yet &mdash; cases you log will show up as a running scorecard.', function(ev){
          return ev.scorerId && ev.scorerId !== state.mentorId
            ? '<span class="scorer-tag">scored by '+esc((mentorById(ev.scorerId)||{}).name || ev.scorerId)+'</span>'
            : '';
        })

      + '<div class="section-sub">Scores '+esc(mentee.name)+' entered for their own cases &mdash; shown for context. A shared case stays pending until you’ve scored it too.</div>'
      + selfSectionHTML;

  /* ---------------- chart drawing (unchanged from the artifact version) ---------------- */

  function drawChart(evalsIn, wrapId){
    var wrap = document.getElementById(wrapId);
    if (!wrap) return;
    var evals = evalsIn.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    if (evals.length === 0) return;

    var cs = getComputedStyle(document.documentElement);
    function cvar(name){ return cs.getPropertyValue(name).trim(); }

    var W = wrap.clientWidth || 700;
    var H = 260;
    var padL = 30, padR = 16, padT = 14, padB = 28;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;

    var series = CATEGORIES.map(function(c){
      return { key:c.key, color: cvar(c.color.replace('var(','').replace(')','')), label:c.short,
        values: evals.map(function(e){ return catAvg(e.scores, c.key); }) };
    });
    var overallColor = cvar('--accent');
    var overallVals = evals.map(function(e){ return overallAvg(e.scores); });

    function xAt(i){ return evals.length===1 ? plotW/2 : (i/(evals.length-1))*plotW; }
    function yAt(v){ return plotH - ((v-1)/9)*plotH; }

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('width','100%');
    svg.setAttribute('height',H);
    svg.style.display = 'block';
    svg.style.overflow = 'visible';

    var g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform','translate('+padL+','+padT+')');
    svg.appendChild(g);

    var gridColor = cvar('--chart-grid');
    var axisColor = cvar('--chart-axis');
    var mutedColor = cvar('--ink-faint');

    [2,4,6,8,10].forEach(function(v){
      var y = yAt(v);
      var line = document.createElementNS(svgNS,'line');
      line.setAttribute('x1',0); line.setAttribute('x2',plotW);
      line.setAttribute('y1',y); line.setAttribute('y2',y);
      line.setAttribute('stroke', v===10 ? axisColor : gridColor);
      line.setAttribute('stroke-width', 1);
      g.appendChild(line);
      var label = document.createElementNS(svgNS,'text');
      label.setAttribute('x', -8); label.setAttribute('y', y+3);
      label.setAttribute('text-anchor','end');
      label.setAttribute('font-size','10.5');
      label.setAttribute('font-family','IBM Plex Mono, monospace');
      label.setAttribute('fill', mutedColor);
      label.textContent = v;
      g.appendChild(label);
    });

    var tickCount = Math.min(6, evals.length);
    for (var t=0; t<tickCount; t++){
      var idx = tickCount===1 ? 0 : Math.round(t*(evals.length-1)/(tickCount-1));
      var tx = xAt(idx);
      var tl = document.createElementNS(svgNS,'text');
      tl.setAttribute('x', tx); tl.setAttribute('y', plotH+20);
      tl.setAttribute('text-anchor', idx===0 ? 'start' : (idx===evals.length-1 ? 'end':'middle'));
      tl.setAttribute('font-size','10.5');
      tl.setAttribute('font-family','IBM Plex Mono, monospace');
      tl.setAttribute('fill', mutedColor);
      tl.textContent = fmtDateShort(evals[idx].date);
      g.appendChild(tl);
    }

    function drawSeries(values, color, width, labelIt){
      // Null (not-observed) points break the line rather than pulling
      // it down to a floor of 0 — a gap in the segment, not a dip.
      var d = '';
      var drawing = false;
      values.forEach(function(v,i){
        if (v === null || v === undefined){ drawing = false; return; }
        d += (drawing ? 'L' : 'M') + xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1) + ' ';
        drawing = true;
      });
      if (d){
        var path = document.createElementNS(svgNS,'path');
        path.setAttribute('d', d.trim());
        path.setAttribute('fill','none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', width);
        path.setAttribute('stroke-linecap','round');
        path.setAttribute('stroke-linejoin','round');
        g.appendChild(path);
      }

      var lastI = -1;
      for (var i=values.length-1; i>=0; i--){
        if (values[i] !== null && values[i] !== undefined){ lastI = i; break; }
      }
      if (lastI === -1) return;

      var dot = document.createElementNS(svgNS,'circle');
      dot.setAttribute('cx', xAt(lastI)); dot.setAttribute('cy', yAt(values[lastI]));
      dot.setAttribute('r', width+1.5);
      dot.setAttribute('fill', color);
      g.appendChild(dot);

      if (labelIt){
        var lx = xAt(lastI) + 6;
        var anchor = 'start';
        if (lx > plotW - 26){ lx = xAt(lastI) - 6; anchor='end'; }
        var lt = document.createElementNS(svgNS,'text');
        lt.setAttribute('x', lx); lt.setAttribute('y', yAt(values[lastI])+3.5);
        lt.setAttribute('text-anchor', anchor);
        lt.setAttribute('font-size','10.5');
        lt.setAttribute('font-family','IBM Plex Mono, monospace');
        lt.setAttribute('font-weight','600');
        lt.setAttribute('fill', color);
        lt.textContent = fmt1(values[lastI]);
        g.appendChild(lt);
      }
    }

    series.forEach(function(s){ drawSeries(s.values, s.color, 2, evals.length>1); });
    drawSeries(overallVals, overallColor, 3, true);

    // hover layer
    var hoverLine = document.createElementNS(svgNS,'line');
    hoverLine.setAttribute('y1',0); hoverLine.setAttribute('y2',plotH);
    hoverLine.setAttribute('stroke', axisColor);
    hoverLine.setAttribute('stroke-width',1);
    hoverLine.style.opacity = 0;
    g.appendChild(hoverLine);

    var allSeries = series.concat([{color: overallColor, values: overallVals, label:'Overall'}]);
    var hoverDots = allSeries.map(function(){
      var c = document.createElementNS(svgNS,'circle');
      c.setAttribute('r', 4);
      c.style.opacity = 0;
      g.appendChild(c);
      return c;
    });

    var overlayRect = document.createElementNS(svgNS,'rect');
    overlayRect.setAttribute('x',0); overlayRect.setAttribute('y',0);
    overlayRect.setAttribute('width',plotW); overlayRect.setAttribute('height',plotH);
    overlayRect.setAttribute('fill','transparent');
    overlayRect.style.cursor = 'crosshair';
    g.appendChild(overlayRect);

    wrap.innerHTML = '';
    wrap.appendChild(svg);
    var tooltip = document.createElement('div');
    tooltip.className = 'tooltip';
    wrap.appendChild(tooltip);

    function showAt(i){
      hoverLine.style.opacity = 1;
      hoverLine.setAttribute('x1', xAt(i)); hoverLine.setAttribute('x2', xAt(i));
      allSeries.forEach(function(s, si){
        var v = s.values[i];
        if (v === null || v === undefined){
          hoverDots[si].style.opacity = 0;
        } else {
          hoverDots[si].style.opacity = 1;
          hoverDots[si].setAttribute('cx', xAt(i));
          hoverDots[si].setAttribute('cy', yAt(v));
          hoverDots[si].setAttribute('fill', s.color);
        }
      });
      var rows = allSeries.map(function(s){
        var v = s.values[i];
        var text = (v === null || v === undefined) ? 'N/A' : fmt1(v);
        return '<div class="t-row"><span class="sw" style="background:'+s.color+'"></span>'+s.label+': <b class="num">'+text+'</b></div>';
      }).join('');
      tooltip.innerHTML = '<div class="t-date">'+fmtDate(evals[i].date)+'</div>'+rows;
      tooltip.style.opacity = 1;
      tooltip.style.left = (padL + xAt(i)) + 'px';
      var overallHere = allSeries[allSeries.length-1].values[i];
      var posY = (overallHere === null || overallHere === undefined) ? plotH/2 : yAt(overallHere);
      tooltip.style.top = (padT + posY) + 'px';
    }
    function hide(){
      hoverLine.style.opacity = 0;
      hoverDots.forEach(function(d){ d.style.opacity = 0; });
      tooltip.style.opacity = 0;
    }
    overlayRect.addEventListener('mousemove', function(ev){
      var rect = svg.getBoundingClientRect();
      var scale = W / rect.width;
      var mx = (ev.clientX - rect.left)*scale - padL;
      var i = evals.length===1 ? 0 : Math.round((mx/plotW)*(evals.length-1));
      i = Math.max(0, Math.min(evals.length-1, i));
      showAt(i);
    });
    overlayRect.addEventListener('mouseleave', hide);
    overlayRect.addEventListener('touchstart', function(ev){
      var tt = ev.touches[0];
      var rect = svg.getBoundingClientRect();
      var scale = W / rect.width;
      var mx = (tt.clientX - rect.left)*scale - padL;
      var i = evals.length===1 ? 0 : Math.round((mx/plotW)*(evals.length-1));
      i = Math.max(0, Math.min(evals.length-1, i));
      showAt(i);
    }, {passive:true});
  }

  /* ---------------- overlays: log a case / pick a mentee / admin ---------------- */

  function renderOverlay(){
    var existing = document.getElementById('overlayRoot');
    if (existing) existing.remove();
    if (!state.overlay) return;

    var root = document.createElement('div');
    root.id = 'overlayRoot';
    root.className = 'overlay';
    root.setAttribute('data-action','overlay-backdrop');

    if (state.overlay === 'admin'){
      root.innerHTML = adminModalHTML();
    } else if (state.overlay === 'pickMentee'){
      root.innerHTML = pickMenteeModalHTML();
    } else if (state.overlay.type === 'newCase'){
      root.innerHTML = newCaseModalHTML(state.overlay.menteeId, state.overlay.source, state.overlay.availableCases);
    }
    document.body.appendChild(root);

    if (state.overlay && state.overlay.type === 'newCase') wireCaseForm(root);
  }

  function pickMenteeModalHTML(){
    var list = state.mentees.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    return '<div class="modal" role="dialog" aria-modal="true">'
      + '<div class="modal-head"><h2>Score a session</h2><button class="close-x" data-action="close-overlay">&times;</button></div>'

        }).join('')
      + '</div>'
      + '</div>'
      + '</div>';

  /**
   * Fetches cases eligible to attach a new scorecard to (recent cases
   * for this mentee, minus any this scorer already has — when that can
   * be known locally) BEFORE opening the modal, in one shot. Never
   * patched in after the fact: a slow network can't wipe a scorer's
   * in-progress sliders by re-rendering under them.
   */
  function openNewCaseOverlay(menteeId, source){
    if (!state.db) return;
    var alreadyScoredCaseIds = source === 'mentor'
      ? podEvalsForMentee(menteeId).filter(function(e){ return e.scorerId === state.mentorId && e.caseId; }).map(function(e){ return e.caseId; })
      : []; // mentee mode has no local read of selfEvaluations to filter against — handled at write time instead

    state.db.collection('cases').where('menteeId','==',menteeId).orderBy('date','desc').limit(50).get().then(function(snap){
      var all = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if (source === 'self'){
        var cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 14);
        var cutoffISO = isoFromDate(cutoff);
        all = all.filter(function(c){ return c.date >= cutoffISO; });
      }
      var eligible = all.filter(function(c){ return alreadyScoredCaseIds.indexOf(c.id) === -1; });
      state.overlay = { type:'newCase', menteeId: menteeId, source: source, availableCases: eligible };
      render();
    }).catch(function(err){
      console.error('load cases failed', err);
      state.overlay = { type:'newCase', menteeId: menteeId, source: source, availableCases: [] };
      render();
    });
  }

      + '</div>';

    var groups = CATEGORIES.map(function(c){

      + groups

  function updateRationaleVisibility(catKey){
    var naEl = document.getElementById('na_'+catKey);
    var sliderEl = document.getElementById('sc_'+catKey);
    var wrap = document.getElementById('rationale_'+catKey);
    var label = document.getElementById('ratLabel_'+catKey);
    if (!naEl || !sliderEl || !wrap) return;
    sliderEl.disabled = naEl.checked;
    if (naEl.checked){
      wrap.hidden = true;
    } else {
      var v = Number(sliderEl.value);
      if (inBand(v)){
        wrap.hidden = true;
      } else {
        wrap.hidden = false;
        if (label) label.textContent = 'Why a '+v+'?';
      }
    }
    updateSaveState();
  }

  function updateSaveState(){
    var blocking = [];
    CATEGORIES.forEach(function(c){
      var naEl = document.getElementById('na_'+c.key);
      var sliderEl = document.getElementById('sc_'+c.key);
      if (!naEl || !sliderEl || naEl.checked) return;
      var v = Number(sliderEl.value);
      if (inBand(v)) return;
      var ratEl = document.getElementById('rat_'+c.key);
      if (!isValidRationale(ratEl ? ratEl.value : '')) blocking.push(c.short);
    });
    var saveBtn = document.getElementById('caseSaveBtn');
    var blockMsg = document.getElementById('caseBlockMsg');
    if (!saveBtn || !blockMsg) return;
    if (blocking.length){
      saveBtn.disabled = true;
      blockMsg.hidden = false;
      blockMsg.textContent = 'Add a reason for: ' + blocking.join(', ');
    } else {
      saveBtn.disabled = false;
      blockMsg.hidden = true;
      blockMsg.textContent = '';
    }
  }

  function wireCaseForm(root){
    CATEGORIES.forEach(function(c){
      var sliderEl = document.getElementById('sc_'+c.key);
      var naEl = document.getElementById('na_'+c.key);
      var valEl = document.getElementById('val_'+c.key);
      var ratEl = document.getElementById('rat_'+c.key);
      if (!sliderEl) return;
      sliderEl.addEventListener('input', function(){
        valEl.textContent = sliderEl.value;
        updateRationaleVisibility(c.key);
      });
      naEl.addEventListener('change', function(){
        valEl.textContent = naEl.checked ? 'N/A' : sliderEl.value;
        updateRationaleVisibility(c.key);
      });
      ratEl.addEventListener('input', updateSaveState);
    });

    root.querySelectorAll('input[name="caseMode"]').forEach(function(r){
      r.addEventListener('change', function(){
        var existingField = document.getElementById('existingCaseField');
        var newFields = document.getElementById('newCaseFields');
        var useExisting = r.value === 'existing' && r.checked;
        if (existingField) existingField.hidden = !useExisting;
        if (newFields) newFields.hidden = useExisting;
      });
    });

    updateSaveState();
  }

  /* ---------------- admin ---------------- */

  function adminModalHTML(){
    var tab = state.adminTab;
    return '<div class="modal wide" role="dialog" aria-modal="true">'
      + '<div class="modal-head"><h2>Admin</h2><button class="close-x" data-action="close-overlay">&times;</button></div>'
      + '<div class="admin-tabs">'
      + '<button class="admin-tab-btn'+(tab==='overview'?' active':'')+'" data-action="admin-tab" data-tab="overview">Cohort overview</button>'
      + '<button class="admin-tab-btn'+(tab==='roster'?' active':'')+'" data-action="admin-tab" data-tab="roster">Roster</button>'
      + '</div>'
      + '<div class="modal-body">'
      + (tab === 'overview' ? adminOverviewHTML() : adminRosterHTML())
      + '</div>'
      + '</div>';
  }

  function adminOverviewHTML(){
    var summary = '<div class="cohort-summary">'
      + '<div class="stat"><span class="v num">'+state.mentors.length+'</span><span class="l">Pod leads</span></div>'
      + '<div class="stat"><span class="v num">'+state.mentees.length+'</span><span class="l">Mentees</span></div>'
      + '<div class="stat"><span class="v num">'+state.allEvaluations.length+'</span><span class="l">Scorecards</span></div>'
      + '</div>';

    if (state.mentors.length === 0){
      return summary + '<p class="empty-note">Add pod leads and mentees via <code>npm run seed</code> to see cohort performance here.</p>';
    }

    var rows = state.mentors.map(function(mentor){
      var mentees = menteesForMentor(mentor.id);
      var menteeStats = mentees.map(function(mt){
        var mentorEvals = state.allEvaluations.filter(function(e){ return e.menteeId===mt.id; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
        var selfEvals = state.allSelfEvaluations.filter(function(e){ return e.menteeId===mt.id; });
        var calib = calibrationMath(pairsFromBulk(mentorEvals, selfEvals));
        var latest = mentorEvals.length ? overallAvg(mentorEvals[mentorEvals.length-1].scores) : null;
        var lastDate = mentorEvals.length ? mentorEvals[mentorEvals.length-1].date : null;
        return { mentee: mt, count: mentorEvals.length, selfCount: selfEvals.length, latest: latest, lastDate: lastDate, calib: calib };
      });
      var totalPodCases = menteeStats.reduce(function(a,s){ return a+s.count; },0);
      var scored = menteeStats.filter(function(s){ return s.latest !== null; });
      var avgScore = scored.length ? scored.reduce(function(a,s){ return a+s.latest; },0)/scored.length : null;
      var lastActivity = menteeStats.reduce(function(acc,s){ return (s.lastDate && (!acc || s.lastDate>acc)) ? s.lastDate : acc; }, null);

      var menteeRows = menteeStats.length
        ? menteeStats.slice().sort(function(a,b){ return a.mentee.name.localeCompare(b.mentee.name); }).map(function(s){
            return '<div class="admin-mentee-row">'
              + '<span class="n">'+esc(s.mentee.name)+'</span>'
              + '<span class="meta">'+s.count+' case'+(s.count===1?'':'s')+(s.selfCount ? ' + '+s.selfCount+' self' : '')+'</span>'
              + badgeHTML(s.latest)
              + (s.calib ? '<span class="meta">Δ ' + calibDeltaHTML(s.calib.overall) + '</span>' : '')
              + '<span class="meta">'+(s.lastDate ? fmtDateShort(s.lastDate) : '&mdash;')+'</span>'
              + '</div>';
          }).join('')
        : '<div class="empty-note" style="padding:6px 0;">No mentees assigned yet.</div>';

      return '<div class="case-row">'
        + '<div class="case-row-head" data-action="toggle-case">'
        + '<span class="cname">'+esc(mentor.name)+'</span>'
        + '<span class="meta">'+mentees.length+' mentee'+(mentees.length===1?'':'s')+'</span>'
        + '<span class="meta">'+totalPodCases+' case'+(totalPodCases===1?'':'s')+'</span>'
        + badgeHTML(avgScore)
        + '<span class="meta">'+(lastActivity ? 'last '+fmtDateShort(lastActivity) : 'no cases yet')+'</span>'
        + '<span class="chevron">▸</span>'
        + '</div>'
        + '<div class="case-row-body">'+menteeRows+'</div>'
        + '</div>';
    }).join('');

    return summary + rows
      + '<p style="margin-top:20px;"><button class="btn btn-small" data-action="export-csv">Export CSV</button></p>';
  }

  function adminRosterHTML(){
    var list = state.mentors.length === 0
      ? '<p class="empty-note">No pod leads yet.</p>'
      : state.mentors.map(function(mentor){
          var mentees = menteesForMentor(mentor.id);
          return '<div class="admin-mentor-block">'
            + '<div class="admin-row admin-row-mentor"><span>'+esc(mentor.name)+'</span><span class="roster-mentee-count">'+mentees.length+' mentee'+(mentees.length===1?'':'s')+'</span></div>'
            + (mentees.length
                ? mentees.map(function(mt){ return '<div class="admin-row"><span>'+esc(mt.name)+'</span></div>'; }).join('')
                : '<div class="empty-note" style="padding:4px 0 2px 8px;">no mentees yet</div>')
            + '</div>';
        }).join('');

    return '<div class="roster-admin-list">'+list+'</div>'
      + '<p class="hint">Roster changes go through <code>npm run seed</code> (or the Firebase console) — the client has no write access to mentors or mentees.</p>';
  }

  function csvField(v){
    if (v === null || v === undefined) return '';
    var s = String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }
  function scoreCell(scores, key){
    var v = scores && scores[key];
    return (v === null || v === undefined) ? '' : v;
  }
  function toCsvLines(header, rows){ return [header.join(',')].concat(rows.map(function(r){ return r.join(','); })).join('\n'); }
  function downloadCsv(filename, content){
    var blob = new Blob([content], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function exportCsv(){
    state.db.collection('cases').get().then(function(snap){
      var cases = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });

      downloadCsv('evaluations.csv', toCsvLines(
        ['id','caseId','menteeId','primaryMentorId','scorerId','source','date','caseName','ps','analytical','comm','biz','notes'],
        state.allEvaluations.map(function(r){
          return [r.id, r.caseId||'', r.menteeId, r.primaryMentorId, r.scorerId||'', r.source, r.date, csvField(r.caseName),
            scoreCell(r.scores,'ps'), scoreCell(r.scores,'analytical'), scoreCell(r.scores,'comm'), scoreCell(r.scores,'biz'), csvField(r.notes)];
        })
      ));
      downloadCsv('self-evaluations.csv', toCsvLines(
        ['id','caseId','menteeId','primaryMentorId','source','date','caseName','ps','analytical','comm','biz','notes'],
        state.allSelfEvaluations.map(function(r){
          return [r.id, r.caseId||'', r.menteeId, r.primaryMentorId, r.source, r.date, csvField(r.caseName),
            scoreCell(r.scores,'ps'), scoreCell(r.scores,'analytical'), scoreCell(r.scores,'comm'), scoreCell(r.scores,'biz'), csvField(r.notes)];
        })
      ));
      downloadCsv('cases.csv', toCsvLines(
        ['id','menteeId','primaryMentorId','caseName','date','createdBy'],
        cases.map(function(r){ return [r.id, r.menteeId, r.primaryMentorId, csvField(r.caseName), r.date, r.createdBy]; })
      ));
    }).catch(function(err){ console.error('export failed', err); showToast('Export failed.'); });
  }

  /* ---------------- event delegation ---------------- */

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');

    if (action === 'select-mentee-self'){
      var id = t.getAttribute('data-id');
      state.menteeId = id;
      try { localStorage.setItem('casebook.menteeId', id); } catch(err){}
      render();
    }
    else if (action === 'switch-mentee'){
      state.menteeId = null;
      state.confirmation = null;
      try { localStorage.removeItem('casebook.menteeId'); } catch(err){}
      render();
    }
    else if (action === 'log-another'){ state.confirmation = null; render(); }
    else if (action === 'new-case'){
      var src = state.mode === 'mentee' ? 'self' : 'mentor';
      openNewCaseOverlay(t.getAttribute('data-id'), src);
    }
    else if (action === 'open-mentee'){ state.selectedMenteeId = t.getAttribute('data-id'); render(); }
    else if (action === 'back-to-roster'){ state.selectedMenteeId = null; render(); }
    else if (action === 'score-any-mentee'){ state.overlay = 'pickMentee'; render(); }
    else if (action === 'pick-mentee-for-scoring'){ openNewCaseOverlay(t.getAttribute('data-id'), 'mentor'); }
    else if (action === 'admin-tab'){ state.adminTab = t.getAttribute('data-tab'); render(); }
    else if (action === 'export-csv'){ exportCsv(); }
    else if (action === 'close-overlay'){ state.overlay = null; render(); }
    else if (action === 'overlay-backdrop'){ if (e.target.id === 'overlayRoot'){ state.overlay = null; render(); } }
    else if (action === 'toggle-case'){
      var row = t.closest('.case-row');
      if (row) row.classList.toggle('open');
    }
  });

  adminBtn.addEventListener('click', function(){ state.overlay = 'admin'; render(); });

  document.addEventListener('submit', function(e){
    if (e.target.id !== 'caseForm') return;
    e.preventDefault();
    if (!state.db) return;

    var overlay = state.overlay;
    var menteeId = overlay.menteeId;
    var source = overlay.source;
    var mentee = menteeById(menteeId);
    if (!mentee){ showToast('Could not find that mentee.'); return; }
    var mentorId = mentee.primaryMentorId;

    var scoresObj = {}, rationale = {}, blocked = false;
    CATEGORIES.forEach(function(c){
      var naEl = document.getElementById('na_'+c.key);
      var sliderEl = document.getElementById('sc_'+c.key);
      if (naEl.checked){ scoresObj[c.key] = null; return; }
      var v = Number(sliderEl.value);
      scoresObj[c.key] = v;
      if (!inBand(v)){
        var ratEl = document.getElementById('rat_'+c.key);
        var text = ratEl.value.trim();
        if (!isValidRationale(text)) blocked = true;
        else rationale[c.key] = text;
      }
    });
    if (blocked){ updateSaveState(); return; }

    var notes = document.getElementById('caseNotes').value.trim();
    var existingField = document.getElementById('existingCaseField');
    var usingExisting = existingField && !existingField.hidden;

    function writeEvaluation(caseId, date, caseName){
      var collectionName = source === 'self' ? 'selfEvaluations' : 'evaluations';
      var docId = source === 'self' ? caseId : (caseId + '_mentor_' + state.mentorId);
      var body = {
        caseId: caseId, menteeId: menteeId, primaryMentorId: mentorId, source: source,
        scores: scoresObj, rationale: rationale, date: date, caseName: caseName, notes: notes,
        createdAt: serverNow()
      };
      if (source === 'mentor') body.scorerId = state.mentorId;

      state.db.collection(collectionName).doc(docId).set(body).then(function(){
        state.overlay = null;
        if (source === 'self'){
          addReceipt(menteeId, { caseId: caseId, caseName: caseName, date: date });
          state.confirmation = { caseName: caseName, date: date };
        } else {
          showToast('Scorecard saved.');
        }
        render();
      }).catch(function(err){
        console.error('save evaluation failed', err);
        if (err && err.code === 'permission-denied'){
          showToast('Couldn’t save — you may have already logged this case, or a score didn’t pass validation.');
        } else {
          showToast('Couldn’t save. Please try again.');
        }
      });
    }

    if (usingExisting){
      var selectedId = document.getElementById('existingCaseSelect').value;
      var caseRec = (overlay.availableCases || []).filter(function(c){ return c.id === selectedId; })[0];
      if (!caseRec){ showToast('Pick a case to score.'); return; }
      writeEvaluation(caseRec.id, caseRec.date, caseRec.caseName);
    } else {
      var date = document.getElementById('caseDate').value || todayISO();
      var caseName = document.getElementById('caseName').value.trim();
      state.db.collection('cases').add({
        menteeId: menteeId, primaryMentorId: mentorId, caseName: caseName, date: date,
        createdBy: source === 'self' ? 'mentee' : state.mentorId, createdAt: serverNow()
      }).then(function(ref){
        writeEvaluation(ref.id, date, caseName);
      }).catch(function(err){
        console.error('create case failed', err);
        showToast('Could not create this case. Please try again.');
      });
    }
  });

  window.addEventListener('resize', function(){
    if (state.overlay || state.mode !== 'mentor' || !state.selectedMenteeId) return;
    drawChart(podEvalsForMentee(state.selectedMenteeId), 'chartWrap');
  });

  init();
})();
</script>
</body>
</html>
